[package]
name = "kernable-soak"
version.workspace = true
edition.workspace = true
# The kernel and its tools: Functional Source License, Apache-2.0 after two years (BUSINESS_MODEL §2).
license = "FSL-1.1-ALv2"
publish.workspace = true

[[bin]]
name = "kernable-soak"
path = "src/main.rs"
test = false

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
kernable = { package = "kernable-sdk", path = "../../sdks/rust" }
kernable-core = { path = "../kernable-core" }
kernable-store = { path = "../kernable-store" }
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-stream.workspace = true
tonic.workspace = true
