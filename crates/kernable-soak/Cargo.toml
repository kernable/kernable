[package]
name = "kernable-soak"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kernable-soak"
path = "src/main.rs"
test = false

[dependencies]
ed25519-dalek.workspace = true
kernable = { package = "kernable-sdk", path = "../../sdks/rust" }
kernable-core = { path = "../kernable-core" }
# The kit cell drives people through the Rust kit's KitApi.
kernable_kit = { package = "kernable-kit", path = "../../kits/rust" }
kernable-store = { path = "../kernable-store" }
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-stream.workspace = true
tonic.workspace = true
