[package]
name = "kernable-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kernable"
path = "src/main.rs"

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
kernable-core = { path = "../kernable-core", features = ["certs"] }
kernable-store = { path = "../kernable-store" }
# `kernable demo` runs its bank with the Rust SDK.
kernable = { path = "../../sdks/rust" }
serde.workspace = true
# `kernable demo` changes an event in its own store, to show that verify finds it.
rusqlite.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower.workspace = true
prost.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Test builds only: KERNABLE_CRASH_AT=<point> aborts the kernel there (see src/crash.rs).
crash-points = []
# Fuzz builds only: entry points for the targets in fuzz/ (see src/fuzzing.rs).
fuzzing = []

[dev-dependencies]
kernable-store = { path = "../kernable-store", features = ["faults"] }
rusqlite.workspace = true
proptest.workspace = true
getrandom.workspace = true

[[test]]
name = "crashes"
required-features = ["crash-points"]

[[test]]
name = "replication_crashes"
required-features = ["crash-points"]

[[test]]
name = "move_crashes"
required-features = ["crash-points"]
