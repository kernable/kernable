[package]
name = "kernable-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
kernable-core = { path = "../kernable-core" }
kernable-store = { path = "../kernable-store" }
serde.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Test builds only: KERNABLE_CRASH_AT=<point> aborts the kernel there (see src/crash.rs).
crash-points = []

[dev-dependencies]
kernable-core = { path = "../kernable-core", features = ["certs"] }
rusqlite.workspace = true
proptest.workspace = true

[[test]]
name = "crashes"
required-features = ["crash-points"]
