<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kernable</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --line: #e3e3de; --text: #1d1d1b; --muted: #6d6d68;
    --accent: #3b5bdb; --ok: #2f9e44; --warn: #e8890c; --bad: #e03131; --dyn: #8f8f88; --live: #1c9bb8;
    --edge: #b9b9b2; --check: #c2255c; --code: #f1f1ed;
    --max: 1600px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515; --panel: #1d1d1d; --line: #2f2f2f; --text: #e9e9e6; --muted: #9a9a95;
      --accent: #7b93ff; --ok: #51cf66; --warn: #fcc419; --bad: #ff6b6b; --dyn: #77776f; --live: #3bc9db;
      --edge: #4a4a46; --check: #f06595; --code: #262626;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header .bar { display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; max-width: var(--max); margin: 0 auto; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  .logo { display: block; height: 26px; width: auto; }
  .logo.dark { display: none; }
  @media (prefers-color-scheme: dark) { .logo.light { display: none; } .logo.dark { display: block; } }
  header .meta { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button { background: none; border: 1px solid transparent; color: var(--muted); padding: 5px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  nav a { color: var(--accent); padding: 5px 12px; text-decoration: none; }
  nav button.on { color: var(--text); border-color: var(--line); background: var(--bg); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  main { padding: 16px 20px; max-width: var(--max); margin: 0 auto; }
  .view { display: none; } .view.on { display: block; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .mapwrap { display: flex; gap: 16px; align-items: flex-start; }
  .map { flex: 1; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  svg text { fill: var(--text); font: 12px system-ui, sans-serif; }
  svg .head { fill: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  svg .node rect { fill: var(--panel); stroke: var(--line); }
  svg .node.sel rect { stroke: var(--accent); stroke-width: 2; }
  svg .node { cursor: pointer; }
  svg .sub { fill: var(--muted); font-size: 11px; }
  svg path.edge { fill: none; stroke: var(--edge); stroke-width: 1.3; }
  svg path.edge.own { stroke-dasharray: 3 4; }
  svg path.edge.check { stroke: var(--check); stroke-dasharray: 5 4; }
  svg path.edge.hi { stroke: var(--accent); stroke-width: 2; }
  svg path.edge.check.hi { stroke: var(--check); stroke-width: 2; }
  svg .dim { opacity: .25; }
  aside { width: 320px; flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
  aside h3 { margin: 0 0 4px; font-size: 15px; word-break: break-all; }
  aside .kind { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 12px 0 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: none; }
  h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 4px 0 8px; font-weight: 600; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .history { display: flex; gap: 16px; align-items: flex-start; }
  .streams { width: 300px; flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-height: calc(100vh - 110px); display: flex; flex-direction: column; position: sticky; top: 70px; }
  .streams input { margin: 10px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  .streams ul { list-style: none; margin: 0; padding: 0 0 6px; overflow: auto; }
  .streams li { padding: 6px 12px; cursor: pointer; border-left: 3px solid transparent; }
  .streams li:hover { background: var(--bg); }
  .streams li.on { border-left-color: var(--accent); background: var(--bg); }
  .streams .id { font-weight: 500; } .streams .of { color: var(--muted); font-size: 12px; }
  .timeline { flex: 1; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .card .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card .v { font-weight: 600; color: var(--accent); } .card .t { font-weight: 600; }
  .card .when { color: var(--muted); font-size: 12px; margin-left: auto; }
  pre { background: var(--code); border-radius: 6px; padding: 8px 10px; margin: 8px 0 0; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; border: 1px solid currentColor; }
  .tag.personal { color: var(--live); } .tag.secret { color: var(--warn); } .tag.erased { color: var(--bad); }
  .cmd { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
  .cmd b { color: var(--text); font-weight: 500; }
  .snap { border-left: 3px solid var(--accent); background: var(--panel); padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .tag.ref { color: var(--muted); }
  .search { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .search input { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; width: 170px; }
  .search label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .search .meta, .more .meta { color: var(--muted); font-size: 13px; }
  button.plain { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 5px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  #found tr.row { cursor: pointer; } #found tr.row:hover td { background: var(--bg); }
  #found tr.open td { background: var(--bg); }
  #found td.wide { padding-top: 0; }
  #found a, #rejections a { color: var(--accent); text-decoration: none; }
  #rejections tr.row { cursor: pointer; } #rejections tr.row:hover td, #rejections tr.open td { background: var(--bg); }
  #rejections td.wide { padding-top: 0; }
  .code { color: var(--bad); font-weight: 600; }
  .spark { display: flex; align-items: center; gap: 8px; }
  .spark svg { display: block; overflow: visible; }
  .spark .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark .base { stroke: var(--line); stroke-width: 1; }
  .spark .mark { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
  .spark .rule { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 2; }
  .spark .say { color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 150px; }
  .more { display: flex; gap: 12px; align-items: center; }
  .err { color: var(--bad); }
  /* processes */
  .procs li .n { float: right; color: var(--muted); font-size: 12px; }
  .procs li .n .bad { color: var(--bad); font-weight: 600; }
  .ptitle { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .ptitle h3 { margin: 0; font-size: 16px; }
  .ptitle select, .pfilter select, .pfilter input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
  .flow { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
  .flow svg { display: block; }
  .flow .step { cursor: pointer; }
  .flow .step .shape { fill: var(--panel); stroke: var(--edge); stroke-width: 1.3; }
  .flow .step.end .shape { stroke-width: 2.5; }
  .flow .step.sel .shape { stroke: var(--accent); stroke-width: 2.2; }
  .flow .step.bad .shape { stroke: var(--bad); stroke-width: 2.2; }
  .flow .step .icon { fill: none; stroke: var(--muted); stroke-width: 1.3; }
  .flow .start { fill: var(--panel); stroke: var(--ok); stroke-width: 2; }
  .flow path.edge { fill: none; stroke: var(--edge); stroke-width: 1.3; }
  .flow path.edge.back { stroke-dasharray: 4 4; }
  .flow path.edge.alt { stroke: var(--warn); }
  .flow .elabel { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
  .flow .badge rect { fill: var(--accent); } .flow .badge text { fill: #fff; font-size: 11px; font-weight: 600; }
  .flow .badge.bad rect { fill: var(--bad); }
  .flow marker path { fill: var(--edge); }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  .tabs button { background: none; border: 1px solid transparent; color: var(--muted); padding: 4px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  .tabs button.on { color: var(--text); border-color: var(--line); background: var(--panel); }
  .pfilter { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .state { display: inline-flex; align-items: center; gap: 6px; }
  #proc-main a { color: var(--accent); text-decoration: none; }
  .resolve pre { margin: 4px 0 0; }
  .card.incident { border-left: 3px solid var(--bad); }
  .card.ended { border-left: 3px solid var(--ok); }
</style>
</head>
<body>
<header>
 <div class="bar">
  <h1><img class="logo light" src="/logo.png" alt="kernable" width="103" height="26"><img class="logo dark" src="/logo-dark.png" alt="kernable" width="103" height="26"></h1>
  <span class="meta" id="meta"></span>
  <span class="pill" id="ready"><span class="dot"></span><span></span></span>
  <nav>
    <button data-view="map" class="on">Map</button>
    <button data-view="connections">Connections</button>
    <button data-view="events">Events</button>
    <button data-view="rejected">Rejected</button>
    <button data-view="history">History</button>
    <button data-view="processes">Processes</button>
    <a id="stage" href="/demo" hidden>Demo stage</a>
  </nav>
 </div>
</header>
<main>
  <section class="view on" id="map">
    <div class="legend">
      <span><i class="dot" style="background:var(--ok)"></i>connected</span>
      <span><i class="dot" style="background:var(--warn)"></i>behind</span>
      <span><i class="dot" style="background:var(--bad)"></i>missing (the kernel waits for it)</span>
      <span><i class="dot" style="background:var(--dyn)"></i>dynamic or away, counts for nobody</span>
      <span><i class="dot" style="background:var(--live)"></i>live</span>
      <span>— produces · reacts</span>
      <span style="color:var(--check)">- - checks commands</span>
    </div>
    <div class="mapwrap">
      <div class="map" id="graph"></div>
      <aside id="details"><div class="kind">Details</div><p class="meta">Click a node.</p></aside>
    </div>
  </section>
  <section class="view" id="connections"></section>
  <section class="view" id="events">
    <form class="search" id="search">
      <input name="type" placeholder="Event type, e.g. orders.Order">
      <input name="tenant" placeholder="Tenant">
      <input name="id" placeholder="Aggregate id">
      <input name="command" placeholder="Command or correlation id">
      <input name="text" placeholder="Payload contains…">
      <button class="plain" type="submit">Search</button>
      <label><input type="checkbox" id="live" style="width:auto"> live</label>
      <span class="meta" id="found-meta"></span>
    </form>
    <table id="found"></table>
    <div class="more"><button class="plain" id="older" hidden>Older</button><span class="meta" id="older-meta"></span></div>
  </section>
  <section class="view" id="rejected">
    <div class="search">
      <input id="reject-filter" placeholder="Filter: type, code, aggregate, tenant, message…" style="width:340px">
      <span class="meta" id="rejected-meta"></span>
    </div>
    <table id="rejections"></table>
  </section>
  <section class="view" id="history">
    <div class="history">
      <div class="streams"><input id="filter" placeholder="Filter aggregates…"><ul id="streams"></ul></div>
      <div class="timeline" id="timeline"><div class="empty">Pick an aggregate.</div></div>
    </div>
  </section>
  <section class="view" id="processes">
    <div class="history">
      <div class="streams procs"><ul id="proc-list"></ul></div>
      <div class="timeline" id="proc-main"><div class="empty">Loading…</div></div>
    </div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
let state = null, selected = null, stream = null, streams = [];

// ---- helpers ----
function el(tag, attrs = {}, ...children) {
  const e = tag.startsWith("svg:") ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.setAttribute("class", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) e.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
const covers = (pattern, name) => pattern === "*" || pattern === name || (pattern.endsWith(".*") && name.split(".")[0] === pattern.slice(0, -2));
const ago = (ms) => {
  if (!ms) return "never";
  const s = Math.max(0, Math.round((state.kernel.now - ms) / 1000));
  return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : new Date(ms).toLocaleString();
};
const time = (ms) => new Date(ms).toLocaleString();
const short = (key) => (key ? key.slice(0, 12) + "…" : "");
const color = (status) => `var(--${{ connected: "ok", behind: "warn", missing: "bad", dynamic: "dyn", away: "dyn", live: "live" }[status]})`;

async function get(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.json();
}

// ---- the model behind the map ----
function model(s) {
  const head = s.kernel.head;
  const nodes = new Map(), edges = [];
  const add = (id, col, label, sub, status, info) => { if (!nodes.has(id)) nodes.set(id, { id, col, label, sub, status, info }); return nodes.get(id); };
  const services = new Map(s.services.map((m) => [m.service, m]));
  for (const m of s.services) {
    const meta = Object.entries(m.metadata).map(([k, v]) => `${k} ${v}`).join(" · ");
    add(`s:${m.service}`, 0, m.service, meta || "membership applied", "connected", { kind: "service", ...m });
  }
  const serviceNode = (name) => name ? add(`s:${name}`, 0, name, "no membership", "dynamic", { kind: "service", service: name, note: "No membership applied: everything it registers counts." }) : null;

  for (const a of s.aggregates) {
    const m = services.get(a.service);
    const status = a.workers > 0 ? "connected" : a.dynamic ? "dynamic" : "missing";
    add(`a:${a.aggregate}`, 1, a.aggregate, `${a.workers} worker${a.workers === 1 ? "" : "s"} · ${a.commands.length} commands`, status, { kind: "aggregate", ...a, listed: m ? m.workers.includes(a.aggregate) : null });
    const owner = serviceNode(a.service);
    if (owner) edges.push({ from: owner.id, to: `a:${a.aggregate}`, kind: "own" });
  }
  for (const m of s.services) for (const a of m.workers) {
    if (!nodes.has(`a:${a}`)) add(`a:${a}`, 1, a, "listed, never registered", "missing", { kind: "aggregate", aggregate: a, service: m.service, note: "Listed in the membership; no worker ever registered it. Its commands wait in the queue." });
    edges.push({ from: `s:${m.service}`, to: `a:${a}`, kind: "own" });
  }

  for (const e of s.events) {
    add(`e:${e.type}`, 2, e.type, `schema ${e.schema}`, "connected", { kind: "event type", ...e });
    for (const w of e.writers) if (nodes.has(`a:${w}`)) edges.push({ from: `a:${w}`, to: `e:${e.type}` });
  }

  for (const l of s.listeners) {
    const behind = l.connected && l.position < head;
    const status = l.live ? "live" : !l.counts ? (l.connected ? "dynamic" : "away") : !l.connected ? "missing" : behind ? "behind" : "connected";
    const what = l.live ? "live" : l.middlewares.length ? "middleware" : "listener";
    const parked = l.parked ? ` · ${l.parked} parked` : "";
    const sub = `${what} · order ${l.order} · ${l.connected ? (behind ? `${head - l.position} behind` : "up to date") : "away"}${parked}`;
    const node = add(`l:${l.name}`, 3, l.name, sub, status, { kind: what, ...l });
    const owner = serviceNode(l.service);
    if (owner) edges.push({ from: owner.id, to: node.id, kind: "own" });
    const types = l.events.length ? l.events : ["*"];
    for (const e of s.events) if (types.some((p) => covers(p, e.type))) edges.push({ from: `e:${e.type}`, to: node.id });
    for (const q of l.queries) {
      add(`q:${q}`, 4, q, "query", "connected", { kind: "query", type: q });
      edges.push({ from: node.id, to: `q:${q}` });
    }
    for (const mw of l.middlewares) for (const a of s.aggregates) {
      if (a.commands.some((c) => mw.types.some((p) => covers(p, c)))) edges.push({ from: node.id, to: `a:${a.aggregate}`, kind: "check" });
    }
  }
  for (const m of s.services) for (const name of [...m.listeners, ...m.middlewares]) {
    if (!nodes.has(`l:${name}`)) add(`l:${name}`, 3, name, "listed, never registered", "missing", { kind: "listener", name, service: m.service, note: "Listed in the membership; it never connected. The kernel is not ready until it does." });
    edges.push({ from: `s:${m.service}`, to: `l:${name}`, kind: "own" });
  }
  return { nodes: [...nodes.values()], edges };
}

// ---- map ----
const COLS = ["Services", "Aggregates", "Event types", "Listeners", "Queries"];
const NODE_H = 40, GAP = 10, TOP = 40, W = 200;

function drawMap() {
  const { nodes, edges } = model(state);
  const box = $("graph");
  const width = Math.max(box.clientWidth, 5 * (W + 40) + 40);
  const step = (width - 40 - W) / 4;
  const counts = [0, 0, 0, 0, 0];
  for (const n of nodes.sort((a, b) => a.label.localeCompare(b.label))) {
    n.x = 20 + n.col * step;
    n.y = TOP + counts[n.col]++ * (NODE_H + GAP);
  }
  const height = TOP + Math.max(1, ...counts) * (NODE_H + GAP) + 10;
  const svg = el("svg:svg", { width, height, viewBox: `0 0 ${width} ${height}` });
  COLS.forEach((c, i) => svg.append(el("svg:text", { class: "head", x: 20 + i * step, y: 22 }, c)));
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const lines = el("svg:g");
  svg.append(lines);
  for (const e of edges) {
    const a = byId.get(e.from), b = byId.get(e.to);
    if (!a || !b) continue;
    let d;
    if (e.kind === "check") {
      // From a middleware back to the aggregate whose commands it checks.
      const x1 = a.x, y1 = a.y + NODE_H / 2, x2 = b.x + W, y2 = b.y + NODE_H / 2;
      d = `M${x1},${y1} C${x1 - 60},${y1 + 30} ${x2 + 60},${y2 + 30} ${x2},${y2}`;
    } else {
      const x1 = a.x + W, y1 = a.y + NODE_H / 2, x2 = b.x, y2 = b.y + NODE_H / 2, mid = (x1 + x2) / 2;
      d = `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`;
    }
    const path = el("svg:path", { class: `edge ${e.kind ?? ""}`, d });
    path.dataset.from = e.from;
    path.dataset.to = e.to;
    lines.append(path);
  }
  for (const n of nodes) {
    const g = el("svg:g", { class: `node${selected === n.id ? " sel" : ""}`, transform: `translate(${n.x},${n.y})`, onclick: () => select(n.id) });
    g.dataset.id = n.id;
    g.append(
      el("svg:rect", { width: W, height: NODE_H, rx: 7 }),
      el("svg:circle", { cx: 12, cy: 14, r: 4.5, fill: color(n.status) }),
      el("svg:text", { x: 23, y: 18 }, fit(n.label, 26)),
      el("svg:text", { class: "sub", x: 12, y: 33 }, fit(n.sub, 32)),
    );
    g.addEventListener("mouseenter", () => highlight(n.id, true));
    g.addEventListener("mouseleave", () => highlight(n.id, false));
    svg.append(g);
  }
  box.replaceChildren(svg);
  if (selected) details(byId.get(selected));
}

// ---- lag over the last hour ----
let trend = null, hover = null;
const SPARK_W = 180, SPARK_H = 28;

async function loadTrend() {
  try { trend = await get("/api/trend"); } catch { return; }
  if (document.querySelector("nav button.on").dataset.view === "connections") drawConnections();
}

/** Events processed per minute over the last minute of samples, or null with too few. */
function rate(rows) {
  const last = rows[rows.length - 1];
  const from = rows.find((r) => r[0] >= last[0] - 60_000);
  if (!from || from === last) return null;
  return Math.round(((last[2] - from[2]) * 60_000) / (last[0] - from[0]));
}

/** How far a listener was behind (head − position), one line over the samples kept. */
function spark(name) {
  const rows = trend?.listeners?.[name];
  if (!rows || rows.length < 2) return el("span", { class: "meta" }, "collecting…");
  const lag = rows.map((r) => Math.max(0, r[1] - r[2]));
  const max = Math.max(1, ...lag);
  const t0 = rows[0][0], span = Math.max(1, rows[rows.length - 1][0] - t0);
  const x = (i) => ((rows[i][0] - t0) / span) * SPARK_W;
  const y = (v) => SPARK_H - 2 - (v / max) * (SPARK_H - 4);
  const d = lag.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const at = hover && hover.name === name ? hover.index : lag.length - 1;
  const svg = el("svg:svg", { width: SPARK_W, height: SPARK_H, viewBox: `0 0 ${SPARK_W} ${SPARK_H}`, role: "img", "aria-label": `${name}: behind by up to ${max} events in the last ${Math.round(span / 60_000)} min` },
    el("svg:line", { class: "base", x1: 0, x2: SPARK_W, y1: SPARK_H - 2, y2: SPARK_H - 2 }),
    el("svg:path", { class: "line", d }),
    hover && hover.name === name ? el("svg:line", { class: "rule", x1: x(at), x2: x(at), y1: 0, y2: SPARK_H }) : null,
    el("svg:circle", { class: "mark", cx: x(at), cy: y(lag[at]), r: 4 }),
    // A hit area over the whole chart: the nearest sample to the pointer.
    el("svg:rect", { x: -4, y: -4, width: SPARK_W + 8, height: SPARK_H + 8, fill: "transparent",
      onmousemove: (ev) => {
        const px = ((ev.clientX - ev.currentTarget.getBoundingClientRect().left - 4) / SPARK_W) * span + t0;
        let best = 0;
        rows.forEach((r, i) => { if (Math.abs(r[0] - px) < Math.abs(rows[best][0] - px)) best = i; });
        if (!hover || hover.name !== name || hover.index !== best) { hover = { name, index: best }; drawConnections(); }
      },
      onmouseleave: () => { hover = null; drawConnections(); } }));
  const r = rate(rows);
  const say = hover && hover.name === name
    ? `${lag[at]} behind · ${new Date(rows[at][0]).toLocaleTimeString()}`
    : `max ${max === 1 && !lag.some((v) => v) ? 0 : max}${r === null ? "" : ` · ${r} events/min`}`;
  return el("div", { class: "spark" }, svg, el("span", { class: "say" }, say));
}

/** A payload with its vault references as tags: personal (subject), secret, or erased. */
function payloadView(text, vault) {
  let data;
  try { data = JSON.parse(text); } catch { return el("pre", {}, text); }
  const pre = el("pre");
  const walk = (v, indent) => {
    const pad = "  ".repeat(indent);
    if (v && typeof v === "object" && !Array.isArray(v) && Object.keys(v).length === 1 && typeof v.$vault === "string") {
      const held = vault?.[v.$vault];
      // Without the vault's view (the events search), only that it is a reference.
      pre.append(!vault ? el("span", { class: "tag ref", title: v.$vault }, "vault")
        : held ? el("span", { class: `tag ${held.secret ? "secret" : "personal"}`, title: v.$vault }, held.secret ? "secret" : `personal · ${held.subject}`)
        : el("span", { class: "tag erased", title: v.$vault }, "erased"));
    } else if (Array.isArray(v)) {
      pre.append("[");
      v.forEach((x, i) => { pre.append(`\n${pad}  `); walk(x, indent + 1); if (i < v.length - 1) pre.append(","); });
      pre.append(v.length ? `\n${pad}]` : "]");
    } else if (v && typeof v === "object") {
      const keys = Object.keys(v);
      pre.append("{");
      keys.forEach((k, i) => { pre.append(`\n${pad}  ${JSON.stringify(k)}: `); walk(v[k], indent + 1); if (i < keys.length - 1) pre.append(","); });
      pre.append(keys.length ? `\n${pad}}` : "}");
    } else pre.append(JSON.stringify(v));
  };
  walk(data, 0);
  return pre;
}

// ---- events: search and live tail ----
const FOUND_MAX = 1000;
let found = [], older = null, tail = null, opened = new Set(), searching = 0;

function filters() {
  const q = new URLSearchParams();
  for (const [k, v] of new FormData($("search"))) if (v.trim()) q.set(k, v.trim());
  return q;
}

/** A new search: newest first. Its head is where the live tail starts. */
async function search() {
  const run = ++searching;
  let r;
  try { r = await get(`/api/events?${filters()}`); } catch (e) { $("found-meta").textContent = String(e); return; }
  if (run !== searching) return;
  found = r.events; older = r.next; tail = r.head; opened = new Set();
  drawFound();
}

async function loadOlder() {
  if (older === null) return;
  const q = filters();
  q.set("before", older);
  const run = searching;
  let r;
  try { r = await get(`/api/events?${q}`); } catch (e) { $("older-meta").textContent = String(e); return; }
  if (run !== searching) return;
  found.push(...r.events); older = r.next;
  drawFound();
}

async function follow() {
  if (!$("live").checked || tail === null) return;
  const q = filters();
  q.set("after", tail);
  q.set("limit", 500);
  const run = searching;
  let r;
  try { r = await get(`/api/events?${q}`); } catch { return; }
  if (run !== searching) return;
  tail = r.last;
  if (!r.events.length) return;
  found.unshift(...r.events.reverse());
  if (found.length > FOUND_MAX) { found.length = FOUND_MAX; older = found[found.length - 1].position; }
  drawFound();
}

/** Opens an aggregate in the History view. */
function openStream(e) {
  stream = { tenant: e.tenant, domain: e.domain, type: e.aggregateType, id: e.aggregateId };

}

function drawFound() {
  const rows = [el("tr", {}, ["Position", "Time", "Event", "Aggregate", "Tenant", "Command"].map((h) => el("th", {}, h)))];
  for (const e of found) {
    const open = opened.has(e.position);
    rows.push(el("tr", { class: `row${open ? " open" : ""}`, onclick: () => { open ? opened.delete(e.position) : opened.add(e.position); drawFound(); } },
      el("td", { class: "mono" }, e.position),
      el("td", {}, time(e.createdAt)),
      el("td", {}, el("b", {}, `${e.domain}.${e.type}`), e.erases ? [" ", el("span", { class: "tag erased" }, "erases")] : null),
      el("td", {}, el("a", { href: "#", onclick: (ev) => { ev.preventDefault(); ev.stopPropagation(); openStream(e); } }, `${e.aggregateType} ${e.aggregateId}`), el("span", { class: "meta" }, ` · v${e.version}`)),
      el("td", {}, e.tenant),
      el("td", { class: "mono", title: e.commandId }, fit(e.commandId, 24))));
    if (open) rows.push(el("tr", {}, el("td", { colspan: 6, class: "wide" },
      payloadView(e.payload, null),
      el("pre", {}, JSON.stringify(e.context, null, 2)),
      el("div", { class: "mono meta" }, `schema ${e.schema} · worker ${short(e.key)} · hash ${e.hash.slice(0, 16)}…`))));
  }
  if (!found.length) rows.push(el("tr", {}, el("td", { colspan: 6, class: "meta" }, "No matching events.")));
  $("found").replaceChildren(...rows);
  $("found-meta").textContent = `${found.length} shown${$("live").checked ? " · following" : ""}`;
  $("older").hidden = older === null;
  $("older-meta").textContent = older === null ? (found.length ? "start of the log reached" : "") : `searched down to position ${older}`;
}

/** Why the command was refused, in one line: the unique key or the requirement that did not hold. */

  return `${r.message}${r.uniqueKey ? ` · key ${r.uniqueKey}` : ""}${need}`;
}

  const f = $("reject-filter").value.toLowerCase();

      el("td", {}, el("a", { href: "#", onclick: (ev) => { ev.preventDefault(); ev.stopPropagation(); openStream(r); } }, `${r.aggregateType} ${r.aggregateId}`)),
      el("td", {}, r.tenant),
      el("td", {}, el("span", { class: "code" }, r.code)),
      el("td", {}, why(r))));
    if (open) rows.push(el("tr", {}, el("td", { colspan: 6, class: "wide" },
      payloadView(r.payload, null),
      el("pre", {}, JSON.stringify(r.context, null, 2)),

  if (!shown.length) rows.push(el("tr", {}, el("td", { colspan: 6, class: "meta" }, rejections.length ? "None matches the filter." : "No rejected commands.")));
  $("rejections").replaceChildren(...rows);
  const capped = rejections.length === rejectionsLimit ? ` (the newest ${rejectionsLimit})` : "";
  $("rejected-meta").textContent = `${shown.length} of ${rejections.length}${capped}`;
}

async function loadCase() {
  const q = new URLSearchParams(openCase);
  try { caseData = await get(`/api/case?${q}`); } catch (e) { caseData = { error: String(e) }; }
}

const currentProcess = () => procs?.processes.find((p) => p.name === procSel);
function currentVersion() {
  const p = currentProcess();
  if (!p || !p.versions.length) return null;
  return p.versions.find((v) => v.version === procVersion) ?? p.versions[p.versions.length - 1];
}

function drawProcesses() {
  const list = procs.processes.map((p) => {
    const open = p.versions.reduce((n, v) => n + Object.values(v.steps).reduce((m, s) => m + Object.values(s.now).reduce((a, b) => a + b, 0), 0), 0);
    const bad = (incidents?.cases ?? []).filter((c) => c.process === p.name).length;
    return el("li", { class: p.name === procSel ? "on" : "", onclick: () => { procSel = p.name; procVersion = null; caseFilter.step = ""; openCase = null; loadProcesses(); } },
      el("span", { class: "n" }, `${open} open`, bad ? [" · ", el("span", { class: "bad" }, `${bad} incident${bad === 1 ? "" : "s"}`)] : null),
      el("div", { class: "id" }, p.name),
      el("div", { class: "of" }, `v${p.versions.length}${p.removed ? " · removed: no new cases" : ""}`));
  });
  $("proc-list").replaceChildren(...(list.length ? list : [el("li", { class: "of" }, "No process registered.")]));
  const p = currentProcess(), v = currentVersion();
  if (!p || !v) { procFrame = ""; $("proc-main").replaceChildren(el("div", { class: "empty" }, "No process registered. Define one in code next to your domain; the SDK registers it when the app starts.")); return; }

  // The controls are built once per process, version and tab, so an open dropdown or the
  // caret in the filter survives the refresh.
  const key = `${p.name}|${p.versions.length}|${v.version}|${procTab}|${openCase ? "case" : ""}`;
  if (key !== procFrame) {
    procFrame = key;
    const versions = el("select", { name: "version" }, [...p.versions].reverse().map((x) => {
      const o = el("option", { value: x.version }, `version ${x.version}${x === p.versions[p.versions.length - 1] ? " (newest)" : ""}`);
      o.selected = x.version === v.version;
      return o;
    }));
    const windows = el("select", { name: "window" }, ["hour", "day", "week"].map((w) => { const o = el("option", { value: w }, `last ${w}`); o.selected = w === procWindow; return o; }));
    const tab = (id, label) => el("button", { class: procTab === id && !openCase ? "on" : "", onclick: () => { procTab = id; openCase = null; drawProcesses(); } }, label);
    const steps = v.model.steps.map((s) => s.name);
    const filter = el("div", { class: "pfilter", id: "p-filter", hidden: procTab !== "cases" || openCase ? "" : null },
      el("select", { name: "state" }, ["open", "running", "waiting", "incident", "ended", "all"].map((x) => { const o = el("option", { value: x }, x === "open" ? "not ended" : x); o.selected = x === caseFilter.state; return o; })),
      el("select", { name: "step" }, ["", ...steps].map((x) => { const o = el("option", { value: x }, x || "every step"); o.selected = x === caseFilter.step; return o; })),
      el("input", { name: "text", placeholder: "Case, key or tenant…", value: caseFilter.text }),
      el("span", { class: "meta", id: "p-count" }));
    $("proc-main").replaceChildren(
      el("div", { class: "ptitle" }, el("h3", {}, p.name), versions, windows, el("span", { class: "meta", id: "p-meta" })),
      el("div", { class: "flow", id: "p-flow" }),
      el("div", { class: "tabs" }, tab("cases", "Cases"), tab("incidents", "Incidents"), tab("statistics", "Statistics")),
      filter,
      el("div", { id: "p-body" }));
  }
  const acting = p.acting?.senderIdentity ? `acts as ${p.acting.senderIdentity}` : `acts as process:${p.name}`;
  const counting = procs.read < procs.head ? ` · counting the log: ${procs.read} of ${procs.head}` : "";
  $("p-meta").textContent = `registered ${time(v.registeredAt)} by ${short(v.key)} · ${acting}${p.removed ? " · removed" : ""}${counting}`;
  $("p-flow").replaceChildren(flow(v));
  const body = openCase ? caseView() : procTab === "incidents" ? incidentsView(p) : procTab === "statistics" ? statisticsView(v) : casesView();
  $("p-body").replaceChildren(...[body].flat());
}

function procChanged(ev) {
  const t = ev.target;
  if (t.name === "version") { procVersion = Number(t.value); caseFilter.step = ""; }
  else if (t.name === "window") procWindow = t.value;
  else if (t.name === "state") caseFilter.state = t.value;
  else if (t.name === "step") caseFilter.step = t.value;
  else return;
  loadProcesses();
}

let typingTimer = null;
function procTyped(ev) {
  if (ev.target.name !== "text") return;
  caseFilter.text = ev.target.value;
  clearTimeout(typingTimer);
  typingTimer = setTimeout(async () => { await loadCases(); drawProcesses(); }, 250);
}

// ---- the diagram, left to right ----
const SW = 156, SH = 58, COL = 250, ROW = 96, PAD = 30;

/** The paths out of a step: where to, and a label for all but the plain `next`. */
function exits(s) {
  const out = [];
  const add = (to, label, alt) => to && out.push({ to, label, alt });
  switch (s.kind) {
    case "command": add(s.next); for (const [code, to] of Object.entries(s.rejected ?? {})) add(to, `rejected ${code}`, true); break;
    case "wait": add(s.next); add(s.onTimeout, "timeout", true); break;
    case "timer": add(s.next); break;
    case "decide": for (const w of s.when ?? []) add(w.next, w.if); add(s.otherwise, "otherwise"); break;
    case "query": for (const x of s.paths ?? []) add(x.next, `= ${JSON.stringify(x.value)}`); add(s.otherwise, "otherwise", true); break;
  }
  return out;
}

/** Ranks (columns) and rows: a longest-path layering from the start, back edges left out. */
function layout(model) {
  const steps = model.steps, index = new Map(steps.map((s, i) => [s.name, i]));
  const out = new Map([["", steps.length ? [{ to: steps[0].name }] : []], ...steps.map((s) => [s.name, exits(s)])]);
  const back = new Set(), order = [], seen = new Set(), stack = new Set();
  const dfs = (n) => {
    seen.add(n); stack.add(n);
    for (const e of out.get(n) ?? []) {
      if (!index.has(e.to)) continue;
      if (stack.has(e.to)) back.add(`${n}>${e.to}`);
      else if (!seen.has(e.to)) dfs(e.to);
    }
    stack.delete(n); order.push(n);
  };
  dfs("");
  for (const s of steps) if (!seen.has(s.name)) dfs(s.name);
  const rank = new Map([["", 0]]);
  for (const n of order.reverse()) for (const e of out.get(n) ?? []) {
    if (!index.has(e.to) || back.has(`${n}>${e.to}`)) continue;
    rank.set(e.to, Math.max(rank.get(e.to) ?? 0, (rank.get(n) ?? 0) + 1));
  }
  const cols = [];
  for (const s of steps) { const r = rank.get(s.name) ?? 1; (cols[r] ??= []).push(s.name); }
  cols[0] = [""];
  // Two sweeps: each step near the middle of the steps leading to it.
  const preds = new Map();
  for (const [n, es] of out) for (const e of es) if (!back.has(`${n}>${e.to}`)) (preds.get(e.to) ?? preds.set(e.to, []).get(e.to)).push(n);
  const row = new Map();
  for (let sweep = 0; sweep < 2; sweep++) for (const col of cols.filter(Boolean)) {
    col.forEach((n, i) => row.set(n, row.has(n) ? row.get(n) : i));
    const mean = (n) => { const ps = (preds.get(n) ?? []).filter((p) => row.has(p)); return ps.length ? ps.reduce((a, p) => a + row.get(p), 0) / ps.length : row.get(n); };
    col.sort((a, b) => mean(a) - mean(b) || (index.get(a) ?? -1) - (index.get(b) ?? -1));
    col.forEach((n, i) => row.set(n, i - (col.length - 1) / 2));
  }
  return { out, back, rank, row, cols: cols.length };
}

function flow(v) {
  const model = v.model, { out, back, rank, row, cols } = layout(model);
  const rows = [...row.values()];
  const minRow = Math.min(0, ...rows), maxRow = Math.max(0, ...rows);
  // Each edge: to the next column directly; over the top on a lane of its own when it skips
  // columns; under the bottom when it goes back.
  // A long edge between steps of the lower rows runs under the bottom, so it crosses no step.
  const edgeList = [];
  let over = 0, under = 0;
  for (const [n, es] of out) for (const e of es) {
    if (!model.steps.some((s) => s.name === e.to)) continue;
    const isBack = back.has(`${n}>${e.to}`);
    const long = (rank.get(e.to) ?? 0) - (rank.get(n) ?? 0) > 1;
    const low = (row.get(n) ?? 0) + (row.get(e.to) ?? 0) > 0;
    const kind = isBack || (long && low) ? "under" : long ? "over" : "next";
    edgeList.push({ from: n, ...e, back: isBack, kind, lane: kind === "over" ? over++ : kind === "under" ? under++ : 0 });
  }
  const LANE = 16;
  const width = PAD * 2 + (cols - 1) * COL + SW;
  const top = PAD + 10 + over * LANE, bottom = top + (maxRow - minRow) * ROW + SH;
  const height = bottom + 34 + under * LANE + 26;
  const pos = (n) => ({ x: PAD + (rank.get(n) ?? 0) * COL, y: top + ((row.get(n) ?? 0) - minRow) * ROW });
  const svg = el("svg:svg", { width, height, viewBox: `0 0 ${width} ${height}` },
    el("svg:defs", {}, el("svg:marker", { id: "arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, el("svg:path", { d: "M0,0 L10,5 L0,10 z" }))));
  const edges = el("svg:g"), labels = el("svg:g");
  svg.append(edges);
  const R = 8;
  for (const e of edgeList) {
    const a = pos(e.from), b = pos(e.to);
    let d, lx, ly, anchor = "start", room = 15;
    if (e.kind === "next") {
      const fromX = e.from === "" ? a.x + 36 : a.x + SW;
      const y1 = a.y + SH / 2, y2 = b.y + SH / 2, mid = (fromX + b.x) / 2;
      d = `M${fromX},${y1} C${mid},${y1} ${mid},${y2} ${b.x},${y2}`;
      lx = fromX + 6; ly = y1 - 6;
    } else {
      // Off the step's middle, a little apart per lane so lanes from one step do not overlap.
      const shift = (e.lane % 4) * 8 - 12;
      const x1 = a.x + SW / 2 + shift, x2 = b.x + SW / 2 + shift;
      const [y1, y2, y] = e.kind === "over" ? [a.y, b.y, top - 12 - e.lane * LANE] : [a.y + SH, b.y + SH, bottom + 34 + e.lane * LANE];
      const dy = e.kind === "over" ? R : -R, dir = x2 > x1 ? 1 : -1;
      d = `M${x1},${y1} L${x1},${y + dy} Q${x1},${y} ${x1 + dir * R},${y} L${x2 - dir * R},${y} Q${x2},${y} ${x2},${y + dy} L${x2},${y2}`;
      lx = x1 + dir * (R + 4); ly = y - 4; room = 32;
      if (dir < 0) anchor = "end";
    }
    edges.append(el("svg:path", { class: `edge${e.back ? " back" : ""}${e.alt ? " alt" : ""}`, d, "marker-end": "url(#arrow)" }, el("svg:title", {}, `${e.from || "start"} → ${e.to}${e.label ? `: ${e.label}` : ""}`)));
    if (e.label) labels.append(el("svg:text", { class: "elabel", x: lx, y: ly, "text-anchor": anchor }, el("svg:title", {}, e.label), fit(e.label, room)));
  }
  // The start: the event that starts a case.
  const s0 = pos("");
  svg.append(el("svg:g", {},
    el("svg:circle", { class: "start", cx: s0.x + 18, cy: s0.y + SH / 2, r: 16 }),
    el("svg:text", { x: s0.x, y: s0.y + SH / 2 + 32, class: "sub" }, fit(`on ${model.start.on}`, 30)),
    el("svg:text", { x: s0.x, y: s0.y + SH / 2 + 48, class: "sub" }, `${v.started} started, last ${procWindow}`)));
  for (const s of model.steps) {
    const { x, y } = pos(s.name), st = v.steps[s.name] ?? { now: {} };
    const open = (st.now.running ?? 0) + (st.now.waiting ?? 0), bad = st.now.incident ?? 0;
    const cls = `step${s.kind === "end" ? " end" : ""}${bad ? " bad" : ""}${caseFilter.step === s.name ? " sel" : ""}`;
    const g = el("svg:g", { class: cls, transform: `translate(${x},${y})`, onclick: () => { caseFilter.step = caseFilter.step === s.name ? "" : s.name; procTab = "cases"; openCase = null; procFrame = ""; loadProcesses(); } });
    g.append(el("svg:title", {}, `${s.name} (${s.kind}): click to list its cases`));
    if (s.kind === "decide") g.append(el("svg:polygon", { class: "shape", points: `${SW / 2},0 ${SW},${SH / 2} ${SW / 2},${SH} 0,${SH / 2}` }));
    else g.append(el("svg:rect", { class: "shape", width: SW, height: SH, rx: s.kind === "end" ? SH / 2 : 8 }));
    let sub = "";
    if (s.kind === "command") sub = s.command;
    else if (s.kind === "wait") sub = `${s.event}${s.timeoutMs ? ` · ${duration(s.timeoutMs)}` : ""}`;
    else if (s.kind === "timer") sub = s.afterMs ? `after ${duration(s.afterMs)}` : `at ${s.at}`;
    else if (s.kind === "query") sub = `? ${s.query}`;
    else if (s.kind === "end") sub = `${v.ended[s.name] ?? 0} ended, last ${procWindow}`;
    const clock = s.kind === "wait" || s.kind === "timer";
    if (clock) g.append(el("svg:circle", { class: "icon", cx: 15, cy: 18, r: 6.5 }), el("svg:path", { class: "icon", d: "M15,14 L15,18 L18,20" }));
    const tx = s.kind === "decide" ? SW / 2 : clock ? 27 : 10;
    const anchor = s.kind === "decide" ? "middle" : "start";
    g.append(el("svg:text", { x: tx, y: s.kind === "decide" ? SH / 2 + 4 : 22, "text-anchor": anchor, "font-weight": 600 }, fit(s.name, s.kind === "decide" ? 14 : 18)));
    if (sub && s.kind !== "decide") g.append(el("svg:text", { class: "sub", x: 10, y: 42 }, fit(sub, 24)));
    const badge = (n, x, cls, title) => el("svg:g", { class: `badge ${cls}`, transform: `translate(${x},-9)` }, el("svg:title", {}, title),
      el("svg:rect", { width: 12 + String(n).length * 7, height: 18, rx: 9 }), el("svg:text", { x: 6, y: 13 }, n));
    if (bad) g.append(badge(bad, SW - 22 - String(bad).length * 7, "bad", `${bad} with an incident`));
    if (open) g.append(badge(open, SW - (bad ? 48 + String(bad).length * 7 : 18) - String(open).length * 7, "", `${open} here now`));
    svg.append(g);
  }
  svg.append(labels);
  const cancelled = v.ended.cancelled ?? 0;
  if (cancelled) svg.append(el("svg:text", { class: "sub", x: PAD, y: height - 8 }, `${cancelled} cancelled by an operator, last ${procWindow}`));
  return svg;
}

// ---- the tabs ----
function casesView() {
  if (!caseList) return el("div", { class: "meta" }, "Loading…");
  $("p-count").textContent = `${caseList.cases.length} of ${caseList.total}${caseFilter.state === "ended" || caseFilter.state === "all" ? ` · the newest ${procs.endedKept} ended per process are kept` : ""}`;
  const rows = [el("tr", {}, ["Case", "Tenant", "Version", "State", "Step", "There since", "Started"].map((h) => el("th", {}, h)))];
  for (const c of caseList.cases) rows.push(el("tr", {},
    el("td", {}, el("a", { href: "#", onclick: (ev) => { ev.preventDefault(); showCase(c); } }, c.id)),
    el("td", {}, c.tenant), el("td", {}, `v${c.version}`), el("td", {}, stateView(c.state)),
    el("td", {}, c.step, c.incident ? [" · ", el("span", { class: "code" }, c.incident.code)] : null),
    el("td", {}, c.state === "ended" ? time(c.lastAt) : ago(c.reachedAt)), el("td", {}, time(c.startedAt))));
  if (!caseList.cases.length) rows.push(el("tr", {}, el("td", { colspan: 7, class: "meta" }, "No case matches.")));
  return el("table", {}, rows);
}

/** The CLI commands that resolve an incident, signed with an operator's key. */
function resolving(c) {
  const at = `${procs.addr} <key> ${c.process} ${c.id} --tenant ${c.tenant}`;
  return el("div", { class: "resolve" },
    el("pre", {}, `# run the step again\nkernable processes retry ${at}\n# go on to the step's next step\nkernable processes skip ${at}\n# end the case\nkernable processes cancel ${at}`));
}

function incidentsView(p) {
  const shown = (incidents?.cases ?? []).filter((c) => c.process === p.name);
  if (!shown.length) return el("div", { class: "empty" }, "No incidents.");
  return shown.map((c) => el("div", { class: "card incident" },
    el("div", { class: "top" }, el("a", { href: "#", class: "t", onclick: (ev) => { ev.preventDefault(); showCase(c); } }, c.id), el("span", { class: "meta" }, `${c.tenant} · v${c.version} · step ${c.step}`), el("span", { class: "when" }, ago(c.lastAt))),
    el("div", {}, el("span", { class: "code" }, c.incident.code), " ", c.incident.message),
    resolving(c)));
}

function statisticsView(v) {
  const rows = [el("tr", {}, ["Step", "Kind", "Now", "Entered", "Left", "Median", "95th percentile", "Timeouts", "Incidents"].map((h) => el("th", {}, h)))];
  for (const s of v.model.steps) {
    const st = v.steps[s.name];
    const now = Object.entries(st.now).map(([k, n]) => `${n} ${k}`).join(", ") || "0";
    rows.push(el("tr", {}, el("td", {}, el("b", {}, s.name)), el("td", {}, s.kind), el("td", {}, now), el("td", {}, st.entered), el("td", {}, s.kind === "end" ? "–" : st.left),
      el("td", {}, s.kind === "end" ? "–" : duration(st.medianMs)), el("td", {}, s.kind === "end" ? "–" : duration(st.p95Ms)), el("td", {}, st.timeouts || "–"), el("td", {}, st.incidents ? el("span", { class: "code" }, st.incidents) : "–")));
  }
  const ended = Object.entries(v.ended).map(([end, n]) => `${n} at ${end}`).join(", ") || "none";
  const open = Object.values(v.steps).reduce((m, s) => m + Object.values(s.now).reduce((a, b) => a + b, 0), 0);
  return [
    el("p", { class: "meta" }, `Version ${v.version}, last ${procWindow}: ${v.started} started · ended ${ended} · ${open} not ended now. Durations are from reaching a step until it completed, exact to within 10%.`),
    el("table", {}, rows)];
}

// ---- one case ----
async function showCase(c) {
  openCase = { tenant: c.tenant, process: c.process, id: c.id };
  caseData = null;
  if (c.process !== procSel) { procSel = c.process; procVersion = null; }
  await loadCase();
  drawProcesses();
}

function linkTo(l) {
  const where = `${l.aggregateType} ${l.aggregateId}`;
  return el("a", { href: "#", onclick: (ev) => { ev.preventDefault(); openStream({ tenant: l.tenant, domain: l.domain, aggregateType: l.aggregateType, aggregateId: l.aggregateId }); } }, `${l.domain}.${where}`);
}

/** One case event in a sentence, with what it links to. */
function caseLine(e) {
  let p = {};
  try { p = JSON.parse(e.payload); } catch {}
  const l = e.link;
  switch (e.type) {
    case "ProcessStarted": return ["started on version ", el("b", {}, p.version), " by ", el("b", {}, p.event), l ? [" of ", linkTo(l), ` (position ${l.position})`] : null];
    case "StepReached": return ["reached ", el("b", {}, p.step), ` (${p.kind})`];
    case "CommandSent": return ["sent ", el("b", {}, p.command), l ? [" to ", linkTo(l), " · ", l.outcome === "rejected" ? el("span", { class: "code" }, `rejected ${l.code}`) : l.outcome] : null];
    case "StepCompleted": return ["completed ", el("b", {}, p.step), `: ${p.outcome}${p.code ? ` ${p.code}` : ""}${p.value !== undefined ? ` ${JSON.stringify(p.value)}` : ""}`, l ? [" by ", el("b", {}, l.type), " of ", linkTo(l)] : null, p.next ? [" → ", el("b", {}, p.next)] : null];
    case "TimerSet": return ["timer for ", el("b", {}, p.step), ` set to ${time(p.at)}`];
    case "TimerFired": return ["timer of ", el("b", {}, p.step), " fired"];
    case "EventKept": return ["kept ", el("b", {}, p.event), " for a later wait", l ? [" from ", linkTo(l)] : null];
    case "IncidentRaised": return [el("span", { class: "code" }, `incident ${p.code}`), " at ", el("b", {}, p.step), `: ${p.message}`];
    case "IncidentResolved": return ["resolved: ", el("b", {}, p.action), " by ", el("span", { class: "mono" }, short(p.by))];
    case "ProcessEnded": return ["ended at ", el("b", {}, p.end), p.by ? [" by ", el("span", { class: "mono" }, short(p.by))] : null];
    default: return [e.type];
  }
}

function caseView() {
  const back = el("a", { href: "#", onclick: (ev) => { ev.preventDefault(); openCase = null; drawProcesses(); } }, "← all cases");
  if (!caseData) return [back, el("div", { class: "meta" }, "Loading…")];
  if (caseData.error) return [back, el("div", { class: "err" }, caseData.error)];
  const shown = (caseList?.cases ?? []).concat(incidents?.cases ?? []).find((c) => c.id === caseData.id && c.tenant === caseData.tenant);
  const head = el("div", { class: "ptitle" }, back, el("h3", {}, `case ${caseData.id}`), el("span", { class: "meta" }, `tenant ${caseData.tenant}`), shown ? stateView(shown.state) : null,
    el("a", { href: "#", onclick: (ev) => { ev.preventDefault(); openStream({ tenant: caseData.tenant, domain: "process", aggregateType: caseData.process, aggregateId: caseData.id }); } }, "its stream in History"));
  const cards = caseData.events.map((e) => el("div", { class: `card${e.type === "IncidentRaised" ? " incident" : e.type === "ProcessEnded" ? " ended" : ""}` },
    el("div", { class: "top" }, el("span", { class: "v" }, `v${e.version}`), el("span", {}, caseLine(e)), el("span", { class: "when" }, time(e.createdAt))),
    el("details", {}, el("summary", { class: "meta" }, e.type), payloadView(e.payload, null))));
  const resolve = shown?.state === "incident" ? [el("h2", {}, "Resolve"), resolving({ ...shown })] : [];
  return [head, ...resolve, ...cards];
}

// ---- refresh ----
async function refresh() {
  try {
    state = await get("/api/state");
  } catch {
    $("ready").lastChild.textContent = "kernel unreachable";
    $("ready").firstChild.style.background = "var(--bad)";
    return;
  }
  const k = state.kernel;
  $("meta").textContent = `${k.version} · ${k.head} events · ${k.queued} queued`;
  $("ready").lastChild.textContent = k.ready;
  $("ready").firstChild.style.background = k.ready === "ready" ? "var(--ok)" : "var(--warn)";
  const view = document.querySelector("nav button.on").dataset.view;
  if (view === "map") drawMap();
  if (view === "connections") drawConnections();
  if (view === "events") follow();
}

document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.id === b.dataset.view));
  if (b.dataset.view === "history") { loadStreams(); loadHistory(); }
  if (b.dataset.view === "events" && tail === null) search();
  if (b.dataset.view === "rejected") loadRejections();
  if (b.dataset.view === "connections") { loadTrend(); loadParked(); }
  if (b.dataset.view === "processes") loadProcesses();
  refresh();
}));
$("filter").addEventListener("input", drawStreams);
$("search").addEventListener("submit", (ev) => { ev.preventDefault(); search(); });
$("older").addEventListener("click", loadOlder);
$("reject-filter").addEventListener("input", drawRejections);
$("live").addEventListener("change", () => ($("live").checked ? search() : drawFound()));
window.addEventListener("resize", () => state && drawMap());
$("proc-main").addEventListener("change", procChanged);
$("proc-main").addEventListener("input", procTyped);
refresh();
setInterval(refresh, 1000);
// Under `kernable demo` only: the way back to the Stage.
fetch("/api/demo").then((r) => { if (r.ok) $("stage").hidden = false; }).catch(() => {});
setInterval(() => document.querySelector("nav button.on").dataset.view === "history" && loadStreams(), 5000);
setInterval(() => document.querySelector("nav button.on").dataset.view === "rejected" && loadRejections(), 5000);
setInterval(() => document.querySelector("nav button.on").dataset.view === "processes" && loadProcesses(), 2000);
setInterval(() => { if (document.querySelector("nav button.on").dataset.view === "connections") { loadTrend(); loadParked(); } }, 5000);
</script>
</body>
</html>
