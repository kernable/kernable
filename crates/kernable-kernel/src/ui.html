<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kernable</title>
<style>
  /* Four places (Overview, Processes, Operations, Explore) under one top bar: navigation,
     search, the verdict. Colors: the logo's blue as the accent; green, amber, red for state. */
  :root {
    --bg: #f5f6fa; --panel: #ffffff; --sunk: #eef0f6; --line: #dfe3ee; --text: #151a30; --muted: #5c6480; --faint: #8b92ab;
    --accent: #2457f5; --accent-soft: #e5ecff; --violet: #6d45f0;
    --ok: #1f9a5c; --ok-soft: #e1f4e9; --warn: #c27400; --warn-soft: #fcefd6; --bad: #d23a4a; --bad-soft: #fbe2e5;
    --dyn: #8f95a8; --live: #138fb0; --edge: #b6bccd; --check: #c2255c; --code: #f1f3f8;
    --max: 1560px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1120; --panel: #151b2f; --sunk: #10162a; --line: #27304f; --text: #e7eaf6; --muted: #a0a7c4; --faint: #6e7696;
      --accent: #6f93ff; --accent-soft: #1d2b56; --violet: #a58bff;
      --ok: #4cc98a; --ok-soft: #13301f; --warn: #f0a93a; --warn-soft: #33260c; --bad: #ff6b78; --bad-soft: #3a1820;
      --dyn: #777e98; --live: #3bc9db; --edge: #485274; --check: #f06595; --code: #1b2238;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  header { border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 3; }
  header .bar { display: flex; align-items: center; gap: 14px; padding: 9px 20px; flex-wrap: wrap; max-width: var(--max); margin: 0 auto; }
  .logo { display: block; height: 24px; width: auto; }
  .logo.dark { display: none; }
  @media (prefers-color-scheme: dark) { .logo.light { display: none; } .logo.dark { display: block; } }
  nav { display: flex; gap: 2px; }
  nav a { color: var(--muted); padding: 6px 12px; border-radius: 7px; font-weight: 500; }
  nav a:hover { text-decoration: none; color: var(--text); }
  nav a.on { color: var(--accent); background: var(--accent-soft); }
  nav .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; text-align: center; }
  #searchform { flex: 1; max-width: 380px; margin-left: auto; }
  #q { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); color: var(--text); font: inherit; }
  .verdict { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; }
  .verdict.ok { background: var(--ok-soft); color: var(--ok); } .verdict.warn { background: var(--warn-soft); color: var(--warn); } .verdict.bad { background: var(--bad-soft); color: var(--bad); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: currentColor; }
  main { padding: 18px 20px 40px; max-width: var(--max); margin: 0 auto; }
  footer { max-width: var(--max); margin: 0 auto; padding: 0 20px 24px; color: var(--faint); font-size: 12px; }
  .view { display: grid; gap: 16px; }
  h2 { font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin: 0; font-weight: 600; display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
  h2 .aside { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: 12px; }
  h3 { margin: 0; font-size: 18px; }
  .grid { display: grid; gap: 14px; }
  .cols-kpi { grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); }
  .cols-2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  .cols-2e { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  @media (max-width: 960px) { .cols-2, .cols-2e { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
  .kpi { display: grid; gap: 2px; }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .kpi .n { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .kpi .s { color: var(--faint); font-size: 12px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); } .faint { color: var(--faint); }
  .row { display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .v { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; }
  .attn { display: grid; grid-template-columns: 4px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; background: var(--sunk); }
  .attn .bar { align-self: stretch; border-radius: 3px; }
  .attn small { display: block; color: var(--muted); }
  .attn.calm { opacity: .7; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  .tbl { border: 1px solid var(--line); border-radius: 10px; overflow: auto; background: var(--panel); }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
  th { color: var(--faint); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; background: var(--sunk); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; } tr.click:hover td, tr.open td { background: var(--sunk); }
  td.wide { padding-top: 0; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  pre { background: var(--code); border-radius: 6px; padding: 8px 10px; margin: 6px 0 0; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); } .chip.warn { background: var(--warn-soft); } .chip.bad { background: var(--bad-soft); } .chip.run { background: var(--accent-soft); color: var(--accent); } .chip.idle { background: var(--sunk); color: var(--muted); }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; border: 1px solid currentColor; }
  .tag.personal { color: var(--live); } .tag.secret { color: var(--warn); } .tag.erased { color: var(--bad); } .tag.ref { color: var(--muted); }
  .code { color: var(--bad); font-weight: 600; }
  .empty { color: var(--muted); padding: 28px; text-align: center; }
  .err { color: var(--bad); }
  .note { color: var(--faint); font-size: 12px; }
  button, select, input { font: inherit; }
  .btn { background: var(--panel); border: 1px solid var(--line); color: var(--accent); padding: 4px 10px; border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .ctl { padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  .cmd { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--code); border: 1px solid var(--line); border-radius: 7px; padding: 6px 6px 6px 10px; }
  .cmd code { white-space: pre-wrap; word-break: break-all; }
  .sub { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
  .sub a { color: var(--muted); padding: 7px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  .sub a:hover { text-decoration: none; color: var(--text); }
  .sub a.on { color: var(--text); border-bottom-color: var(--accent); }
  .title { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .title .meta { color: var(--muted); font-size: 13px; }
  .key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; border-bottom: 1px dashed var(--faint); cursor: pointer; }
  .key.named { font-family: inherit; font-size: inherit; }
  .pop { position: absolute; z-index: 10; width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; box-shadow: 0 10px 30px -12px rgba(10, 20, 60, .35); font-size: 13px; }
  .pop h4 { margin: 0; font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .pop code { word-break: break-all; }
  .pop ul { margin: 0; padding-left: 16px; color: var(--muted); display: grid; gap: 2px; }
  .pop .controls input { flex: 1; }
  svg text { fill: var(--muted); font: 11px system-ui, sans-serif; }
  svg .gridline { stroke: var(--line); stroke-width: 1; }
  /* lists beside a main area */
  .split { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; transition: grid-template-columns .25s ease; }
  .split.collapsed { grid-template-columns: 42px minmax(0, 1fr); }
  @media (max-width: 900px) { .split, .split.collapsed { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .split { transition: none; } }
  .lhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--line); min-height: 40px; }
  .lhead .note { white-space: nowrap; overflow: hidden; }
  .side-toggle { flex: none; width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; display: grid; place-items: center; }
  .side-toggle:hover { color: var(--accent); border-color: var(--accent); }
  .split.collapsed .lhead { padding: 6px; justify-content: center; }
  .split.collapsed .lhead .note, .split.collapsed .list ul, .split.collapsed .list .head { display: none; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-height: calc(100vh - 150px); display: flex; flex-direction: column; position: sticky; top: 70px; overflow: hidden; }
  .list .head { padding: 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .list ul { list-style: none; margin: 0; padding: 0 0 6px; overflow: auto; }
  .list li { padding: 7px 12px; cursor: pointer; border-left: 3px solid transparent; }
  .list li:hover { background: var(--sunk); }
  .list li.on { border-left-color: var(--accent); background: var(--sunk); }
  .list .id { font-weight: 500; word-break: break-all; } .list .of { color: var(--muted); font-size: 12px; }
  .list .n { float: right; color: var(--muted); font-size: 12px; }
  /* map */
  .map { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .kind { color: var(--faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-word; white-space: pre-line; }
  /* explore: domains and the catalog */
  .domains { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  .dcard { cursor: pointer; transition: border-color .15s; }
  .dcard:hover { border-color: var(--accent); }
  .dcard .dhead { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
  .dcard .dhead b { font-size: 16px; }
  .drow { display: grid; grid-template-columns: 92px 1fr; gap: 8px; font-size: 13px; align-items: start; }
  .drow > span:first-child { color: var(--faint); font-size: 12px; padding-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .t { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 6px; background: var(--sunk); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; color: var(--text); }
  a.t:hover { border-color: var(--accent); text-decoration: none; }
  .t.tev { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .t.proc { background: var(--panel); border-style: dashed; }
  .t.more { background: none; border: none; color: var(--faint); }
  .t .dot { width: 7px; height: 7px; }
  .agg { display: grid; gap: 12px; }
  .agg-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .agg-head b { font-size: 15px; }
  .flowrow { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1.4fr); gap: 10px; align-items: start; }
  @media (max-width: 900px) { .flowrow { grid-template-columns: 1fr; } .flowrow .arrow { display: none; } }
  .flowrow .arrow { color: var(--faint); text-align: center; padding-top: 18px; font-size: 16px; }
  .wildcard { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  /* history cards */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; }
  .card .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card .v { font-weight: 600; color: var(--accent); } .card .t { font-weight: 600; }
  .card .when { color: var(--muted); font-size: 12px; margin-left: auto; }
  .card .line { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card details { margin-top: 6px; } .card summary { color: var(--muted); font-size: 12.5px; cursor: pointer; }
  .snap { border-left: 3px solid var(--accent); background: var(--panel); padding: 8px 12px; border-radius: 6px; font-size: 13px; }
  /* sparklines */
  .spark { display: flex; align-items: center; gap: 8px; }
  .spark svg { display: block; overflow: visible; }
  .spark .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark.warn .line { stroke: var(--warn); }
  .spark .base { stroke: var(--line); stroke-width: 1; }
  .spark .mark { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
  .spark.warn .mark { fill: var(--warn); }
  .spark .say { color: var(--muted); font-size: 12px; white-space: nowrap; }
  /* process diagram */
  .flow { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .flow svg { display: block; margin: 0 auto; }
  .flow .conds { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 0 16px 12px; font-size: 12px; color: var(--muted); }
  .flow .conds b { color: var(--text); font-weight: 600; }
  .flow .wide { padding: 0 16px 10px; font-size: 12px; color: var(--faint); }
  .flow svg text { fill: var(--text); font-size: 12px; }
  .flow .sub { fill: var(--muted); font-size: 11px; }
  .flow .step { cursor: pointer; }
  .flow .step .shape { fill: var(--panel); stroke: var(--edge); stroke-width: 1.3; }
  .flow .step.end .shape { stroke-width: 2.5; }
  .flow .step.sel .shape { stroke: var(--accent); stroke-width: 2.2; }
  .flow .step.bad .shape { stroke: var(--bad); stroke-width: 2.2; }
  .flow .step .icon { fill: none; stroke: var(--muted); stroke-width: 1.3; }
  .flow .start { fill: var(--panel); stroke: var(--ok); stroke-width: 2; }
  .flow path.edge { fill: none; stroke: var(--edge); stroke-linecap: round; }
  .flow path.edge.used { stroke: var(--accent); stroke-opacity: .45; }
  .flow path.edge.alt.used { stroke: var(--warn); stroke-opacity: .55; }
  .flow path.edge.back { stroke-dasharray: 4 4; }
  .flow .elabel { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
  .flow .badge rect { fill: var(--accent); } .flow .badge text { fill: #fff; font-size: 11px; font-weight: 600; }
  .flow .badge.bad rect { fill: var(--bad); }
  .flow marker path { fill: var(--edge); }
  .flow .faded { opacity: .35; }
  .flow .step.here .shape { stroke: var(--accent); stroke-width: 2.4; fill: var(--accent-soft); }
  .flow .step.done-end .shape { stroke: var(--ok); stroke-width: 2.5; fill: var(--ok-soft); }
  /* a case as a story */
  .story { display: grid; }
  .ev { display: grid; grid-template-columns: 76px 18px 1fr; gap: 10px; }
  .ev .t { color: var(--faint); font-size: 12px; text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .ev .rail { display: flex; flex-direction: column; align-items: center; }
  .ev .rail i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--accent); background: var(--panel); margin-top: 4px; flex: none; }
  .ev .rail i.warn { border-color: var(--warn); } .ev .rail i.bad { border-color: var(--bad); background: var(--bad-soft); } .ev .rail i.end { border-color: var(--ok); background: var(--ok-soft); }
  .ev .rail u { width: 2px; flex: 1; background: var(--line); min-height: 14px; }
  .ev .c { padding-bottom: 14px; } .ev .c small { display: block; color: var(--muted); }
  .bars { display: grid; gap: 6px; }
  .hbar { display: grid; grid-template-columns: 150px 1fr 60px; gap: 10px; align-items: center; font-size: 13px; }
  .hbar .track { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; display: flex; }
  .hbar .v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
 <div class="bar">
  <a href="/"><img class="logo light" src="/logo.png" alt="kernable" width="95" height="24"><img class="logo dark" src="/logo-dark.png" alt="kernable" width="95" height="24"></a>
  <nav>
    <a href="/" data-view="overview">Overview</a>
    <a href="/processes" data-view="processes">Processes<span class="count" id="nav-incidents" hidden></span></a>
    <a href="/operations" data-view="operations">Operations</a>
    <a href="/explore" data-view="explore">Explore</a>
    <a id="stage" href="/demo" hidden>Demo stage</a>
  </nav>
  <form id="searchform"><input id="q" placeholder="Search an order, case, command or correlation ID…" autocomplete="off"></form>
  <span class="verdict ok" id="verdict" title=""><span class="dot"></span><span>…</span></span>
 </div>
</header>
<main>
  <section class="view" id="v-overview"></section>
  <section class="view" id="v-processes"></section>
  <section class="view" id="v-operations"></section>
  <section class="view" id="v-explore">
    <div class="sub" id="explore-tabs">
      <a href="/explore/domains" data-tab="domains">Domains</a>
      <a href="/explore/catalog" data-tab="catalog">Catalog</a>
      <a href="/explore/events" data-tab="events">Event log</a>
      <a href="/explore/aggregates" data-tab="aggregates">Aggregates</a>
    </div>
    <div id="x-domains" class="grid"></div>
    <div id="x-catalog" class="grid" hidden></div>
    <div id="x-events" hidden>
      <form class="controls" id="search" style="margin-bottom:10px">
        <input class="ctl" name="type" placeholder="Event type, e.g. shop.Order">
        <input class="ctl" name="tenant" placeholder="Tenant">
        <input class="ctl" name="id" placeholder="Aggregate ID">
        <input class="ctl" name="command" placeholder="Command or correlation ID">
        <input class="ctl" name="text" placeholder="Payload contains…">
        <button class="btn" type="submit">Search</button>
        <label><input type="checkbox" id="engine"> process engine's events</label>
        <label><input type="checkbox" id="live"> follow</label>
        <span class="note" id="found-meta"></span>
      </form>
      <div class="tbl"><table id="found"></table></div>
      <div class="controls" style="margin-top:10px"><button class="btn" id="older" hidden>Older</button><span class="note" id="older-meta"></span></div>
    </div>
    <div id="x-aggregates" class="split" hidden>
      <div class="list"><div class="lhead" id="agg-head"><span class="note">Aggregates</span></div><div class="head"><input class="ctl" id="filter" placeholder="Filter aggregates…"><label class="note"><input type="checkbox" id="streams-engine"> process cases too</label></div><ul id="streams"></ul></div>
      <div class="grid" id="timeline"><div class="empty">Pick an aggregate.</div></div>
    </div>
  </section>
  <section class="view" id="v-search"></section>
</main>
<footer id="footer"></footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// Views are put together with optional parts (`cond ? part : null`): replaceChildren skips the
// missing ones and flattens lists, as `el` does, instead of writing "null" into the page.
const nativeReplace = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...parts) {
  return nativeReplace.apply(this, parts.flat(Infinity).filter((x) => x !== null && x !== undefined && x !== false));
};
const NS = "http://www.w3.org/2000/svg";

// ---- helpers ----
function el(tag, attrs = {}, ...children) {
  const e = tag.startsWith("svg:") ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.setAttribute("class", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);

/** How far a listener was behind (head − position) over the hour the kernel kept. */

  const t0 = rows[0][0], span = Math.max(1, rows[rows.length - 1][0] - t0);

  const y = (v) => SH_ - 2 - (v / max) * (SH_ - 4);

  const svg = el("svg:svg", { width: SW_, height: SH_, viewBox: `0 0 ${SW_} ${SH_}`, role: "img", "aria-label": `${name}: behind by up to ${max} events` },
    el("svg:line", { class: "base", x1: 0, x2: SW_, y1: SH_ - 2, y2: SH_ - 2 }), el("svg:path", { class: "line", d }), el("svg:circle", { class: "mark", cx: x(lag.length - 1), cy: y(lag[lag.length - 1]), r: 3.5 }));
  return el("div", { class: `spark${behindNow >= 100 ? " warn" : ""}` }, svg, el("span", { class: "say" }, behindNow > 0 ? `${num(behindNow)} behind` : "caught up", ` · max ${num(Math.max(...lag))}`));
}

// ---- what the kernel knows of the domains: aggregates, commands, events, readers, queries ----
const domainOf = (type) => type.split(".")[0];
const short = (type) => type.split(".").slice(1).join(".");

/** Everything Explore shows, derived from /api/state and the process models. */
function catalogData() {
  const s = state, head = s.kernel.head;
  const status = (l) => l.live ? "live" : !l.counts ? (l.connected ? "dynamic" : "away") : !l.connected ? "missing" : head - l.position >= 100 ? "behind" : "connected";
  // A listener that registered no event types gets every event its key may read.
  const everything = (l) => !l.live && (!l.events.length || l.events.includes("*"));
  const listeners = s.listeners.map((l) => ({ ...l, status: status(l), everything: everything(l) }));
  const models = (procs?.processes ?? []).map((p) => ({ name: p.name, removed: p.removed, versions: p.versions.length, model: p.versions[p.versions.length - 1]?.model })).filter((p) => p.model);
  const commandType = (c) => { const [d, , name] = c.split("."); return name ? `${d}.${name}` : c; };
  for (const p of models) {
    p.events = [p.model.start.on, ...p.model.steps.filter((x) => x.kind === "wait").map((x) => x.event)];
    p.commands = p.model.steps.filter((x) => x.kind === "command").map((x) => commandType(x.command));
    p.queries = p.model.steps.filter((x) => x.kind === "query").map((x) => x.query);
  }
  const events = s.events.filter((e) => !e.type.startsWith("process.")).map((e) => ({
    ...e, domain: domainOf(e.type),
    readers: listeners.filter((l) => !l.everything && l.events.some((p) => covers(p, e.type))),
    processes: models.filter((p) => p.events.includes(e.type)),
  }));
  const aggregates = s.aggregates.map((a) => ({ ...a, domain: domainOf(a.aggregate), name: short(a.aggregate), ok: a.workers > 0 || a.dynamic }));
  const commands = aggregates.flatMap((a) => a.commands.map((c) => ({
    type: c, domain: domainOf(c), aggregate: a,
    checkedBy: listeners.filter((l) => l.middlewares.some((m) => m.types.some((p) => covers(p, c)))),
    sentBy: models.filter((p) => p.commands.includes(c)),
  })));
  const queries = listeners.flatMap((l) => l.queries.map((q) => ({ type: q, domain: domainOf(q), answeredBy: l, askedBy: models.filter((p) => p.queries.includes(q)) })));
  const names = new Set([...aggregates.map((a) => a.domain), ...events.map((e) => e.domain), ...queries.map((q) => q.domain), ...models.map((p) => domainOf(p.name))]);
  const domains = [...names].sort().map((d) => {
    const own = { aggregates: aggregates.filter((a) => a.domain === d), events: events.filter((e) => e.domain === d), queries: queries.filter((q) => q.domain === d), processes: models.filter((p) => domainOf(p.name) === d) };
    const readers = new Map(), checkers = new Map();
    for (const e of own.events) for (const l of e.readers) readers.set(l.name, l);
    for (const c of commands.filter((x) => x.domain === d)) for (const l of c.checkedBy) checkers.set(l.name, l);
    // What it uses of other domains: their events its processes wait for or start on.
    const uses = new Set();
    for (const p of own.processes) for (const e of p.events) if (domainOf(e) !== d) uses.add(domainOf(e));
    const bad = own.aggregates.some((a) => !a.ok) || [...readers.values(), ...own.queries.map((q) => q.answeredBy)].some((l) => l.status === "missing");
    const warn = [...readers.values()].some((l) => l.status === "behind");
    return { name: d, ...own, readers: [...readers.values()], checkers: [...checkers.values()], uses: [...uses], level: bad ? "bad" : warn ? "warn" : "ok" };
  });
  return { domains, events, commands, queries, listeners, models, wildcards: listeners.filter((l) => l.everything) };
}

/** A payload with its vault references as tags: personal (subject), secret, or erased. */
function payloadView(text, vault) {
  let data;
  try { data = JSON.parse(text); } catch { return el("pre", {}, text); }
  const pre = el("pre");
  const walk = (v, indent) => {
    const p = "  ".repeat(indent);
    if (v && typeof v === "object" && !Array.isArray(v) && Object.keys(v).length === 1 && typeof v.$vault === "string") {
      const held = vault?.[v.$vault];
      pre.append(!vault ? el("span", { class: "tag ref", title: v.$vault }, "vault")
        : held ? el("span", { class: `tag ${held.secret ? "secret" : "personal"}`, title: v.$vault }, held.secret ? "secret" : `personal · ${held.subject}`)
        : el("span", { class: "tag erased", title: v.$vault }, "erased"));
    } else if (Array.isArray(v)) {
      pre.append("["); v.forEach((x, i) => { pre.append(`\n${p}  `); walk(x, indent + 1); if (i < v.length - 1) pre.append(","); }); pre.append(v.length ? `\n${p}]` : "]");
    } else if (v && typeof v === "object") {
      const keys = Object.keys(v);
      pre.append("{"); keys.forEach((k, i) => { pre.append(`\n${p}  ${JSON.stringify(k)}: `); walk(v[k], indent + 1); if (i < keys.length - 1) pre.append(","); }); pre.append(keys.length ? `\n${p}}` : "}");
    } else pre.append(JSON.stringify(v));
  };
  walk(data, 0);
  return pre;
}
/** A payload in one line: its top-level fields, values shortened. */
function oneLine(text) {
  try {
    const d = JSON.parse(text);
    if (!d || typeof d !== "object") return String(d);
    return Object.entries(d).map(([k, v]) => `${k}: ${v && typeof v === "object" ? (v.$vault ? "‹vault›" : "{…}") : fit(JSON.stringify(v), 40)}`).join(" · ") || "no data";
  } catch { return fit(text, 80); }
}

// ---- the event log: search and live tail ----
const FOUND_MAX = 1000;
let found = [], older = null, tail = null, opened = new Set(), searching = 0;
function filters() {
  const q = new URLSearchParams();
  for (const [k, v] of new FormData($("search"))) if (v.trim()) q.set(k, v.trim());
  if (!$("engine").checked) q.set("business", "1");
  return q;
}
async function search() {
  const run = ++searching;
  let r;
  try { r = await get(`/api/events?${filters()}`); } catch (e) { $("found-meta").textContent = String(e); return; }
  if (run !== searching) return;
  found = r.events; older = r.next; tail = r.head; opened = new Set();
  drawFound();
}
async function loadOlder() {
  if (older === null) return;
  const q = filters(); q.set("before", older);
  const run = searching; let r;
  try { r = await get(`/api/events?${q}`); } catch (e) { $("older-meta").textContent = String(e); return; }
  if (run !== searching) return;
  found.push(...r.events); older = r.next; drawFound();
}
async function follow() {
  if (!$("live").checked || tail === null) return;
  const q = filters(); q.set("after", tail); q.set("limit", 500);
  const run = searching; let r;
  try { r = await get(`/api/events?${q}`); } catch { return; }
  if (run !== searching) return;
  tail = r.last;
  if (!r.events.length) return;
  found.unshift(...r.events.reverse());
  if (found.length > FOUND_MAX) { found.length = FOUND_MAX; older = found[found.length - 1].position; }
  drawFound();
}
function drawFound() {
  const rows = [el("tr", {}, ["Position", "Time", "Event", "Aggregate", "Data", "Tenant"].map((h) => el("th", {}, h)))];
  for (const e of found) {
    const open = opened.has(e.position);
    rows.push(el("tr", { class: `click${open ? " open" : ""}`, onclick: () => { open ? opened.delete(e.position) : opened.add(e.position); drawFound(); } },
      el("td", { class: "mono" }, e.position), el("td", {}, el("span", { title: iso(e.createdAt) }, iso(e.createdAt))),
      el("td", {}, el("b", {}, `${e.domain}.${e.type}`), e.erases ? [" ", el("span", { class: "tag erased" }, "erases")] : null),
      el("td", {}, el("a", { href: historyHref({ tenant: e.tenant, domain: e.domain, type: e.aggregateType, id: e.aggregateId }), onclick: (ev) => ev.stopPropagation() }, `${e.aggregateType} ${e.aggregateId}`), el("span", { class: "faint" }, ` · v${e.version}`)),
      el("td", { class: "muted" }, fit(oneLine(e.payload), 70)), el("td", {}, e.tenant)));
    if (open) rows.push(el("tr", {}, el("td", { colspan: 6, class: "wide" }, payloadView(e.payload, null), el("pre", {}, JSON.stringify(e.context, null, 2)),
      el("div", { class: "note mono" }, `command ${e.commandId} · schema ${e.schema} · worker `, keyView(e.key), ` · hash ${e.hash.slice(0, 16)}…`))));
  }
  if (!found.length) rows.push(el("tr", {}, el("td", { colspan: 6, class: "note" }, "No matching events.")));
  $("found").replaceChildren(...rows);
  $("found-meta").textContent = `${found.length} shown${$("live").checked ? " · following" : ""}`;
  $("older").hidden = older === null;
  $("older-meta").textContent = older === null ? (found.length ? "start of the log reached" : "") : `searched down to position ${num(older)}`;
}

// ================= Search =================
let searchResult = null, searchRun = 0;
async function runSearch(q) {
  const run = ++searchRun;
  searchResult = { q, loading: true };
  render();
  if (!q.trim()) { searchResult = { q, empty: true }; drawSearch(); return; }
  const t = q.trim();
  const [byId, byCommand, cases, history] = await Promise.all([
    get(`/api/events?${new URLSearchParams({ id: t, limit: 200 })}`).catch(() => null),
    get(`/api/events?${new URLSearchParams({ command: t, limit: 200 })}`).catch(() => null),
    get(`/api/cases?${new URLSearchParams({ text: t, limit: 50 })}`).catch(() => null),
    get(`/api/events?${new URLSearchParams({ text: t, limit: 50, business: "1" })}`).catch(() => null),
  ]);
  if (run !== searchRun) return;
  const streamsOf = (evs) => { const m = new Map(); for (const e of evs ?? []) { const k = `${e.tenant}/${e.domain}/${e.aggregateType}/${e.aggregateId}`; if (!m.has(k)) m.set(k, { tenant: e.tenant, domain: e.domain, type: e.aggregateType, id: e.aggregateId, last: e }); } return [...m.values()]; };
  searchResult = { q: t, aggregates: streamsOf(byId?.events), commands: byCommand?.events ?? [], cases: cases?.cases ?? [], mentions: streamsOf(history?.events).filter((s) => s.id !== t), partial: [byId, byCommand, history].some((r) => r && r.next !== null) };
  drawSearch();
}
function drawSearch() {

  if (r.empty) { box.replaceChildren(el("div", { class: "empty" }, "Type an order, case, command or correlation ID in the search box.")); return; }
  const section = (title, items) => items.length ? el("div", { class: "panel" }, el("h2", {}, title, el("span", { class: "aside" }, String(items.length))), items) : null;
  const parts = [
    section("Aggregates with this ID", r.aggregates.map((s) => el("div", { class: "row" }, el("span", { class: "dot ok" }), el("a", { href: historyHref(s) }, `${s.domain}.${s.type} ${s.id}`), el("span", { class: "v" }, s.tenant, " · last ", when(s.last.createdAt))))),
    section("Process cases", r.cases.map((c) => el("div", { class: "row" }, stateChip(c.state), el("a", { href: caseHref(c) }, `${c.process}: ${c.key}`, el("span", { class: "faint" }, ` #${c.id.split("#")[1] ?? ""}`)), el("span", { class: "v" }, `${c.step} · `, when(c.lastAt))))),
    section("Events of this command or correlation", r.commands.slice(0, 50).map((e) => el("div", { class: "row" }, el("span", { class: "mono faint" }, e.position), el("span", {}, el("b", {}, `${e.domain}.${e.type}`), " on ", el("a", { href: historyHref({ tenant: e.tenant, domain: e.domain, type: e.aggregateType, id: e.aggregateId }) }, `${e.aggregateType} ${e.aggregateId}`)), el("span", { class: "v" }, when(e.createdAt))))),
    section("Aggregates whose data mentions it", r.mentions.slice(0, 30).map((s) => el("div", { class: "row" }, el("span", { class: "dot", style: "color:var(--dyn)" }), el("a", { href: historyHref(s) }, `${s.domain}.${s.type} ${s.id}`), el("span", { class: "v" }, s.tenant)))),
  ].filter(Boolean);
  box.replaceChildren(el("div", { class: "title" }, el("h3", {}, `“${r.q}”`), el("span", { class: "meta" }, r.partial ? "searched the newest part of the log; Explore › Event log goes further" : "searched the whole log")),
    ...(parts.length ? parts : [el("div", { class: "empty" }, "Nothing found: no aggregate, case, command or correlation with this ID.")]));
}

$("search").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const q = new URLSearchParams();

async function tick() {
  await loadState();
  const top = document.querySelector("nav a.on")?.dataset.view;
  if (top === "explore" && exploreTab === "events") follow();
  if (top === "processes" && route.view === "case" && caseData && !caseData.events?.some((e) => e.type === "ProcessEnded")) loadCaseRoute();
  render();
}
async function slow() {
  await Promise.all([loadSystem(), loadTrend(), loadParked(), loadRejections(), loadProcs()]);
  const top = document.querySelector("nav a.on")?.dataset.view;
  if (top === "processes" && route.view === "processes" && procFrame) { const p = currentProcess(); if (p) await loadCases(p, currentVersion(p)); }
  if (top === "explore" && exploreTab === "aggregates") loadStreams();
  render();
}
onRoute();
tick(); slow();
setInterval(tick, 2000);
setInterval(slow, 5000);
