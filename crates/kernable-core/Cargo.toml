[package]
name = "kernable-core"
description = "The kernable protocol: messages, signing, hash chain and transport, shared by the kernel and the Rust SDK."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true

repository.workspace = true
homepage.workspace = true
rust-version = "1.93"
documentation = "https://kernable.com/docs/"
readme = "README.md"
keywords = ["event-sourcing", "cqrs", "grpc", "protocol"]
include = ["src/**/*", "build.rs", "proto/**/*", "README.md", "LICENSE"]
categories = ["network-programming", "cryptography"]

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
prost.workspace = true
sha2.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tokio.workspace = true
hyper-util.workspace = true
tower.workspace = true
zeroize.workspace = true
rcgen = { workspace = true, optional = true }

[features]
# `certs`: create a CA and certificates for mTLS (tests and `kernable certs`).
certs = ["dep:rcgen"]

[dev-dependencies]
hex.workspace = true
proptest.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
