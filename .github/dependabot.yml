# Dependency updates. Few pull requests: per ecosystem, every minor and patch update across its
# directories comes as one grouped pull request a week; a major update comes on its own, as it may
# need code changes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The root workspace (kernel, store, SDK, kit, doc examples) and the fuzz targets, which are a
  # workspace of their own with their own lock file.
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]

  # The TypeScript SDK and kit, and the documentation site.
  - package-ecosystem: npm
    directories:
      - /sdks/typescript
      - /kits/typescript
      - /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types: [minor, patch]

  # The Python SDK (pyproject.toml, requirements.txt) and kit (requirements.txt).
  - package-ecosystem: pip
    directories:
      - /sdks/python
      - /kits/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip:
        update-types: [minor, patch]
