name: Release

# Releases a version tag (v0.2.1), which scripts/release.sh pushes once every check held on the
# developer's machine. First, without publishing anything: the binaries (scripts/build-binaries.sh, as
# a local build makes them) and the release notes (scripts/release-notes.py). Then, after one
# approval in the `release` environment, side by side: the Rust crates to crates.io,
# @kernable/sdk to npm, kernable-sdk to PyPI (Trusted Publishing: no tokens), the Go module (its
# tag sdks/go/v<version>, fetched once by the Go module proxy), the GitHub release
# with build provenance for each archive, the downloads and the documentation on kernable.com
# (an SSH key that can only rsync into download/ and docs/). Last, the release is checked as a
# user gets it, on Linux and macOS. Each part that is already done is skipped, so a failed run
# can run again. See RELEASING.md.

on:
  push:
    tags: ["v*"]
  # A trial, started by hand: the binaries and the notes of the version in Cargo.toml, as the
  # release would make them; nothing is published.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" = push ]; then v="${GITHUB_REF_NAME#v}"; else v=$cargo; fi
          npm=$(node -p 'require("./sdks/typescript/package.json").version')
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' sdks/python/pyproject.toml)
          echo "tag $v, Cargo $cargo, npm $npm, PyPI $py"
          [ "$v" = "$cargo" ] && [ "$v" = "$npm" ] && [ "$v" = "$py" ]
          echo "version=$v" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
          # Both Linux targets with cargo zigbuild, against glibc 2.31 (Debian 11, Ubuntu 20.04).
          - os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install  # the toolchain pinned in rust-toolchain.toml
      - if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install -q cargo-zigbuild ziglang
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - run: scripts/build-binaries.sh "${{ needs.version.outputs.version }}" ${{ matrix.targets }}
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ runner.os }}
          path: dist/${{ needs.version.outputs.version }}/kernable-*.tar.gz
          if-no-files-found: error

  assemble:
    name: Checksums and notes
    needs: [version, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: release
          merge-multiple: true
      - run: |
          v=${{ needs.version.outputs.version }}
          [ "$GITHUB_EVENT_NAME" != push ] || git fetch -q --force origin "refs/tags/v$v:refs/tags/v$v"
          set -- release/kernable-*.tar.gz
          [ $# = 4 ] || { echo "not 4 archives: $*"; exit 1; }
          (cd release && sha256sum kernable-*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          # The tag's message, when it says more than its subject, starts the notes.
          summary=$(git tag -l --format='%(contents:body)' "v$v")
          scripts/release-notes.py "$v" --sums release/SHA256SUMS --summary "$summary" > release/NOTES.md
          cat release/NOTES.md
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release
          if-no-files-found: error

  # Everything below waits for the one approval in the `release` environment, and starts together;
  # a trial (workflow_dispatch) stops before it.

  crates:
    name: crates.io
    needs: [version, assemble]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # Each crate on its own: a run after a partial publish publishes only the missing ones.
      - id: exists
        run: |
          missing=
          for crate in kernable-core kernable-sdk-macros kernable-sdk; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'kernable-release (github.com/kernable/kernable)' \
              "https://crates.io/api/v1/crates/$crate/${{ needs.version.outputs.version }}")
            if [ "$code" = 200 ]; then echo "$crate is published"; else missing="$missing -p $crate"; fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.missing != ''
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.exists.outputs.missing != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          (cd crates/kernable-core && ./pack_proto.sh)
          (cd sdks/rust && ./pack_kit.sh)
          cargo publish --allow-dirty ${{ steps.exists.outputs.missing }}

  npm:
    name: npm
    needs: [version, assemble]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - id: exists
        run: |
          if npm view "@kernable/sdk@${{ needs.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.published == 'false'
        working-directory: sdks/typescript
        run: npm ci --no-audit --no-fund && npm publish

  pypi:
    name: PyPI
    needs: [version, assemble]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: exists
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/kernable-sdk/${{ needs.version.outputs.version }}/json")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.published == 'false'
        run: |
          make py
          cd sdks/python
          .venv/bin/python pack_kit.py
          .venv/bin/pip install -q build
          .venv/bin/python -m build --outdir dist .
      - if: steps.exists.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  # A Go module in a subdirectory is released by its tag: sdks/go/v0.3.0 on the release's commit.
  go:
    name: Go module
    needs: [version, assemble]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdks/go/go.mod
          cache: false
      - run: |
          if git ls-remote --exit-code --tags origin "refs/tags/sdks/go/v$V" >/dev/null; then
            echo "sdks/go/v$V exists"
          else
            git tag "sdks/go/v$V" "v$V^{commit}"
            git push origin "refs/tags/sdks/go/v$V"
          fi
          # The proxy fetches it once; from then on `go get` and pkg.go.dev have it.
          for _ in $(seq 20); do
            GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "github.com/kernable/kernable/sdks/go@v$V" && exit 0
            sleep 15
          done
          exit 1

  github:
    name: GitHub release and downloads
    needs: [version, assemble]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      # Build provenance: `gh attestation verify <archive> -R kernable/kernable` shows it was
      # built by this workflow from this tag.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/kernable-*.tar.gz
      - run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" --clobber release/kernable-*.tar.gz release/SHA256SUMS
            gh release edit "v$V" --notes-file release/NOTES.md
          else
            gh release create "v$V" --verify-tag --latest --title "kernable $V" \
              --notes-file release/NOTES.md release/kernable-*.tar.gz release/SHA256SUMS
          fi
      - name: The downloads on kernable.com
        env:
          SITE_SSH_KEY: ${{ secrets.SITE_SSH_KEY }}
          SITE_KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SITE_SSH_KEY" > ~/.ssh/site && chmod 600 ~/.ssh/site
          printf '%s\n' "$SITE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh="ssh -i $HOME/.ssh/site -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          mkdir -p "up/$V" && cp release/kernable-*.tar.gz release/SHA256SUMS "up/$V/"
          rsync -rt --chmod=D755,F644 -e "$ssh" "up/$V" release@kernable.com:download/
          # Checked as served before it becomes the latest.
          curl -fsSL "https://kernable.com/download/$V/SHA256SUMS" | cmp - release/SHA256SUMS
          cp scripts/install.sh up/install.sh && printf '%s\n' "$V" > up/latest
          rsync -t --chmod=F644 -e "$ssh" up/install.sh up/latest release@kernable.com:download/
          [ "$(curl -fsSL https://kernable.com/download/latest)" = "$V" ]
          rm -f ~/.ssh/site

  docs:
    name: Documentation on kernable.com
    needs: [version, assemble]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: |
          (cd sdks/typescript && npm ci --no-audit --no-fund --silent)
          cd docs && npm ci --no-audit --no-fund --silent && npm run -s build
      - env:
          SITE_SSH_KEY: ${{ secrets.SITE_SSH_KEY }}
          SITE_KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SITE_SSH_KEY" > ~/.ssh/site && chmod 600 ~/.ssh/site
          printf '%s\n' "$SITE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # docs/ belongs to the documentation alone: pages removed from it go here too.
          rsync -rt --delete --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/site -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            docs/.vitepress/dist/ release@kernable.com:docs/
          rm -f ~/.ssh/site

  verify:
    name: As a user gets it (${{ matrix.os }})
    needs: [version, crates, npm, pypi, go, github, docs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdks/go/go.mod
          cache: false
      - run: scripts/verify-release.sh "${{ needs.version.outputs.version }}"
