name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: make test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install  # the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: make test

  check:
    name: make ${{ matrix.part }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [check-rust, check-crash, check-sdks, check-docs]
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v5
      - run: rustup toolchain install  # the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - if: matrix.part == 'check-rust'
        run: cargo install cargo-audit --locked
      - run: make ${{ matrix.part }}
