name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: make test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install  # the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make test

  check:
    name: make ${{ matrix.part }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [check-rust, check-crash, check-sdks, check-docs]
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v7
      - run: rustup toolchain install  # the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: matrix.part == 'check-sdks' || matrix.part == 'check-docs'
        uses: actions/setup-go@v6
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - if: matrix.part == 'check-rust'
        run: podman --version && podman info --format '{{.Host.NetworkBackend}} {{.Host.Pasta.Executable}}' || true
      - if: matrix.part == 'check-rust'
        run: cargo install cargo-audit --locked
      # cargo-nextest from its release, pinned and checked.
      - if: matrix.part == 'check-rust'
        run: |
          curl -fsSL --retry 3 -o /tmp/nextest.tgz https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz
          echo "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a  /tmp/nextest.tgz" | sha256sum -c -
          tar xzf /tmp/nextest.tgz -C ~/.cargo/bin
          cargo nextest --version
      - run: make ${{ matrix.part }}
