[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
serde_json = "1"
