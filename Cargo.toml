[workspace]
resolver = "3"
members = ["crates/*", "sdks/rust", "sdks/rust-macros", "kits/rust", "docs/examples/getting-started", "docs/examples/concepts", "docs/examples/shop/rs"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/kernable/kernable"
homepage = "https://kernable.com"

[workspace.dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
# Only to wipe the AES and GHASH key schedules when a vault is dropped.
aes = { version = "0.8", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
zeroize = "1"
proptest = "1"
prost = "0.14"
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.10"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "1"
rcgen = "0.14"
tracing = "0.1"
# The backup follower's S3 requests: a small blocking client with rustls.
ureq = { version = "3", default-features = false, features = ["rustls"] }
hmac = "0.12"
# An instance's vault and exchange keys, derived from its one key (design/instance-keys.md).
hkdf = "0.12"
# The sealed copies at relays: XChaCha20-Poly1305, a random 192-bit nonce per record.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Debug builds keep only line tables (a panic or backtrace still names file and line): full debug
# info doubled target/ and the time to link.
[profile.dev]
debug = "line-tables-only"

# Dependencies (SQLite, ring, prost, tonic) optimized in debug builds: tests spend most of their
# time in them. Without debug info: nobody steps through them.
[profile.dev.package."*"]
opt-level = 2
debug = false
