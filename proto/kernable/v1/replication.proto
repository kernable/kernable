// Replication between a primary kernel and its standby (design/replication.md). Not part
// of the client protocol: only kernels speak it.
syntax = "proto3";

package kernable.v1;

import "kernable/v1/kernable.proto";
import "kernable/v1/storage.proto";

// A standby follows its primary. The standby's key needs a grant for `replicate` (`*`): the
// stream carries every record of the primary's store, with the vault values and files they
// refer to, in plaintext, so run it over mutual TLS only.
service ReplicationService {
  // FollowRequest.hello -> FollowResponse.challenge -> FollowRequest.challenge_response ->
  // FollowResponse.start, then either an image (image..., image_end) or straight records;
  // the standby acknowledges what it applied and synced.
  rpc Follow(stream FollowRequest) returns (stream FollowResponse);
  // Asked of a standby: stop following and serve as the primary. Signed by a key granted
  // `manage` for `*`, over kernable.v1.promote, valid 60 s around issued_at.
  rpc Promote(PromoteRequest) returns (PromoteResult);
  // Asked of a primary with a standby in sync: hand the primary role over to it now. The
  // primary refuses new requests (UNAVAILABLE), lets running ones finish, and waits until the
  // standby holds every record. In a pair it then tells the witness HANDOVER and the
  // standby claims at once; without a witness it sends the standby TAKE_OVER on its stream, and
  // the standby takes over. Either way the old primary stops, and never serves as the primary
  // again unless started to follow. Signed by a key granted `manage` for `*`, over
  // kernable.v1.switchover, valid 60 s around issued_at. FAILED_PRECONDITION: no standby in
  // sync, or the standby did not catch up in time (the primary then serves on).
  rpc Switchover(SwitchoverRequest) returns (SwitchoverResult);
}

message SwitchoverRequest {
  int64 issued_at = 1;
  Signature sig = 2;
  uint32 protocol = 3; // not signed
}

// The standby holds every record up to `seq` and takes over.
message SwitchoverResult {
  uint64 seq = 1;
  string standby = 2; // the new primary's key ID
}

message FollowRequest {
  oneof msg {
    FollowHello hello = 1;
    ChallengeResponse challenge_response = 2;
    FollowAck ack = 3;
    TookOver took_over = 4;
    Leaving leaving = 5;
  }
}

// Where the standby's record log stands; seq 0 with the zero hash for an empty standby.
message FollowHello {
  string key_id = 1;
  uint64 seq = 2;
  bytes hash = 3;
  uint32 protocol = 4;
  // A backup follower (`kernable backup`), not a standby: its key needs `backup` for `*`
  // and the kernel `--backup on`. It never counts for `--replication sync`, gets the vault
  // values sealed (VaultRow.sealed) as an export does, and one follows at a time. Its acks only
  // keep the records it still needs. Seq 0 asks for a full image.
  bool backup = 5;
  // The records the standby could go back to, newest first after its head (seq, hash): the
  // record before each of its newest writes it can take back (design/rewind.md). A primary that
  // holds one of them answers REWIND to the newest it holds instead of DIVERGED.
  repeated RecordPoint rewind_points = 6;
  // A kernel of a pair: the newest witness generation it has seen (absent: none), so the
  // primary learns it too.
  WitnessGeneration witness_generation = 7;
}

message RecordPoint {
  uint64 seq = 1;
  bytes hash = 2;
}

// Every record up to `seq` is applied and on the standby's disk.
message FollowAck {
  uint64 seq = 1;
}

message FollowResponse {
  oneof msg {
    Challenge challenge = 1;
    FollowStart start = 2;
    ImageBatch image = 3;
    ImageEnd image_end = 4;
    RecordBatch records = 5;
    StandbyInSync in_sync = 6;
    TakeOver take_over = 7;
    // A pair's primary: the newest witness generation it has seen, sent once the stream
    // follows and again whenever it rises. The standby ignores witnesses older than it.
    WitnessGeneration generation = 8;
  }
}

// Without a witness: the standby has caught up, and the primary tells nothing from now on that
// the standby does not hold. Only a standby told so may be promoted.
message StandbyInSync {}

// A switchover without a witness: the primary tells nothing more, and the standby holds every
// record up to `seq`. The standby answers TookOver and serves as the primary.
message TakeOver {
  uint64 seq = 1;
}

// The standby took over at record `seq`.
message TookOver {
  uint64 seq = 1;
}

// The standby stops on purpose (SIGTERM): the primary of a pair need not wait for it and commits
// alone at once. The primary ends the stream.
message Leaving {}

enum FollowMode {
  FOLLOW_MODE_UNSPECIFIED = 0;
  FOLLOW = 1;   // records after the standby's head follow
  IMAGE = 2;    // the standby is empty or too far behind: a full image comes first
  DIVERGED = 3; // the standby holds records the primary does not: it moves its stores aside
  REWIND = 4;   // it does, but can take them back to `rewind_to`, then follows on from there
}

message FollowStart {
  FollowMode mode = 1;
  string message = 2;
  uint64 rewind_to = 3; // with REWIND
}

// Part of a full image: records in an order that applies (see Store::image), and the vault
// rows and files they refer to.
message ImageBatch {
  repeated LogRecord records = 1;
  repeated VaultRow vault = 2;
  repeated DataFile files = 3;
}

// The image stands at this record: the standby's record log starts here.
message ImageEnd {
  uint64 seq = 1;
  bytes hash = 2;
}

// Records of the primary's log, with the vault rows and files they refer to. `head` is the
// primary's head when it sent them: a standby that applied up to it is caught up.
message RecordBatch {
  repeated ReplicatedRecord records = 1;
  repeated VaultRow vault = 2;
  repeated DataFile files = 3;
  uint64 head = 4;
}

// A vault value with what the vault keeps about it, decrypted: the standby encrypts it with
// its own vault key.
message VaultRow {
  string ref = 1;
  string subject = 2;
  bool secret = 3;
  string command_id = 4;
  string tenant = 5;
  // The stream whose event refers to it; unset for a command's values.
  optional string stream_tenant_id = 6;
  string domain = 7;
  string aggregate_type = 8;
  string aggregate_id = 9;
  bytes value = 10;
  int64 created_at = 11;
  // A personal unique key's value: filed under its identity (see Vault::put_key).
  bool key = 12;
  // `value` is the 12-byte nonce and the ciphertext as the source vault stores them (an
  // export, ExportHeader.vault): only a vault with the source's key reads it.
  bool sealed = 13;
}

// A file of the data store as it is now; `absent` if it was deleted. In an image, files go by
// `path`, their place in the store (see DataStore::dump), with `data` as stored.
message DataFile {
  string tenant_id = 1;
  string domain = 2;
  string key = 3;
  bool absent = 4;
  string content_type = 5;
  bytes data = 6;
  string path = 7;
}

message PromoteRequest {
  int64 issued_at = 1;
  Signature sig = 2;
  uint32 protocol = 3;
}

message PromoteResult {
  // The head of the record log the new primary starts from.
  uint64 seq = 1;
}

// The witness: a small third process that decides which kernel of a pair is the
// primary. A kernel started with `--witness` asks it for its role, the primary renews its
// lease with it, and a standby claims the primary's place through it once the lease expired.
// The witness also records whether the primary has a standby in sync or commits alone, so a
// standby that lacks writes is never made the primary.
// The trust records a partition takes from the control partition: every grant,
// revocation and membership, and the partition map. Asked every second by every other
// partition's primary, signed by its node key (granted `replicate`).
service TrustSyncService {
  rpc Sync(TrustSyncRequest) returns (TrustSync);
}

// Signed over kernable.v1.trust-sync (issued_at), valid 60 s around it.
message TrustSyncRequest {
  int64 issued_at = 1;
  Signature sig = 2;
  uint32 protocol = 3;
}

message TrustSync {
  repeated Grant grants = 1;
  repeated RevocationRecord revocations = 2;  // signed by the control partition's kernel
  repeated MembershipRecord memberships = 3;
  PartitionMap map = 4;
  // Every process version and the newest state of each process (design/processes.md): every
  // partition knows every model, and runs the cases of its own tenants.
  repeated ProcessRecord processes = 5;
}

// Unique keys with scope global across partitions. The control partition owns them:
// before a partition commits a new global key, it reserves it there (Reserve); the owner grants
// it unless another partition still holds it, or is about to commit it (Holds). Signed by the
// partition's node key (granted `replicate`) over kernable.v1.global-keys.
service GlobalKeyService {
  rpc Reserve(GlobalKeyRequest) returns (GlobalKeyAnswer);
  rpc Holds(GlobalKeyRequest) returns (GlobalKeyAnswer);
}

message GlobalKeyRequest {
  string op = 1;          // reserve | holds: signed, so one cannot pass for the other
  repeated bytes keys = 2;
  string partition = 3;   // the asking partition
  int64 issued_at = 4;
  Signature sig = 5;
  uint32 protocol = 6;
}

// One answer per key: reserved for the asking partition, or (Holds) held there.
message GlobalKeyAnswer {
  repeated bool granted = 1;
}

// Moving a tenant: the target partition copies it from the source (Export, once the
// source's queue holds none of its commands), then tells the control partition (Done), which
// hands it the tenant's global keys. Signed by the partition's node key (granted `replicate`)
// over kernable.v1.move (op, tenant, from, to, issued_at).
service MoveService {
  rpc Export(MoveRequest) returns (stream MoveBatch);
  rpc Done(MoveRequest) returns (MoveResult);
}

message MoveRequest {
  string op = 1;          // precopy | export | done
  string tenant = 2;
  string from = 3;
  string to = 4;
  repeated bytes global_keys = 5; // done: the tenant's global keys, now on `to`
  int64 issued_at = 6;
  Signature sig = 7;
  uint32 protocol = 8;
  // export: only what the target lacks after a precopy up to this source position (0: all):
  // commits with events after it, and every rejection and commit without events.
  uint64 after = 9;
}

// The tenant's records in an order that applies (commands as enqueued, commits in log order,
// rejections), with the vault rows and files they need; `source_head` with the last batch.
message MoveBatch {
  repeated LogRecord records = 1;
  repeated VaultRow vault = 2;
  repeated DataFile files = 3;
  uint64 source_head = 4;
  bool last = 5;
  // With the last batch: what each of the tenant's streams holds, read after its queue drained
  // (an export, not a precopy, which leaves the target holding no keys of the tenant).
  repeated StreamIndex indexes = 6;
}

message MoveResult {}

service WitnessService {
  rpc Ask(WitnessRequest) returns (WitnessAnswer);
}

enum WitnessOp {
  WITNESS_OP_UNSPECIFIED = 0;
  // Renew the primary's lease, or learn who the primary is. On a witness without a primary,
  // the first node to ask becomes the primary of term 1.
  LEASE = 1;
  // The primary commits without its standby: the standby may not be made the primary.
  ALONE = 2;
  // The primary's standby `standby` holds every write again.
  IN_SYNC = 3;
  // The in-sync standby takes the primary's place: granted once the primary's lease expired.
  CLAIM = 4;
  // The primary of `term` gives its place to the standby in sync (a planned switchover):
  // its lease ends now, and the standby's claim is granted without waiting for it.
  HANDOVER = 5;
}

// Signed by the node's key over kernable.v1.witness (op, term, address, standby, issued_at);
// valid 60 s around issued_at. The node's grant (kernable-grant) needs `replicate`.
message WitnessRequest {
  WitnessOp op = 1;
  string node = 2;     // the node's key ID
  uint64 term = 3;     // the term the node knows
  string address = 4;  // where the other node reaches this one (--advertise)
  string standby = 5;  // IN_SYNC: the standby's key ID
  int64 issued_at = 6;
  Signature sig = 7;
  uint32 protocol = 8;
}

message WitnessAnswer {
  bool granted = 1;
  uint64 term = 2;
  string primary = 3;          // key ID of the primary of `term`
  string primary_address = 4;
  string in_sync = 5;          // key ID of the standby in sync; empty while the primary is alone
  uint64 lease_ms = 6;         // how long a granted lease lasts, from when the node asked
  string message = 7;          // why not, if not granted
  // The witness's generation (`kernable witness --generation`); absent: generation 0. A kernel
  // ignores an answer older than the newest generation it has seen, or naming another witness.
  WitnessGeneration generation = 8;
}

// Which witness of a pair is the current one: a witness replaced gets a higher generation,
// signed by a root key (`kernable witness generation`). Signed over
// kernable.v1.witness-generation. `witness` is the address the kernels name in --witness.
message WitnessGeneration {
  uint64 generation = 1;
  string witness = 2;
  int64 issued_at = 3; // ms since epoch
  Signature root_sig = 4;
}

// What the witness keeps on its disk.
message WitnessState {
  uint64 term = 1;
  string primary = 2;
  string primary_address = 3;
  string in_sync = 4;
}

// One batch a backup follower took, with the time it took it: what a backup segment
// holds, one after another, each preceded by its length as a varint. `kernable restore --at`
// stops before the first batch taken after that time.
message BackupBatch {
  int64 taken_at = 1; // ms since epoch
  RecordBatch batch = 2;
}

// A backup generation's base is complete (its last object, written after every part): the
// image stands at record `seq` with `hash`, and the parts `base-000001`.. hold ImageBatch
// messages, each preceded by its length as a varint.
message BackupBase {
  uint64 seq = 1;
  bytes hash = 2;
  uint32 parts = 3;
  int64 created_at = 4; // ms since epoch, when the image ended
  uint64 records = 5;
  uint64 vault_values = 6;
  uint64 files = 7;
}
