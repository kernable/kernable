// kernable protocol, version 1. Payloads (of commands, events, queries, answers and snapshots)
// are opaque bytes to the kernel. Signatures cover the byte layouts in SIGNING.md, never the
// protobuf encoding.
//
// Protocol versions: every request and stream opening (SubmitRequest, QueryRequest,
// SubscribeRequest, DataRequest, CacheRequest, RevokeRequest, ApplyRequest, RetryRequest,
// Register, Hello)
// carries `protocol`, the version its sender speaks. It is never signed. The kernel accepts a
// range of versions and refuses others with FAILED_PRECONDITION, naming the range and whether
// the SDK or the kernel needs an update. 0 (unset) is never accepted. Until the first release
// the version stays 1 and changes in place: SDKs and kernel must come from the same build.
//
// Names: a domain is an identifier of letters, digits, `-` and `_` that starts with a letter;
// by convention it is lowercase (`orders`), like aggregate types, while command, event and query
// types are capitalized (`PlaceOrder`); both cases are valid, and names are case-sensitive.
// Command, event, query and aggregate types are unique within their domain. Requests and events
// carry the domain and the type separately, unqualified (`orders` and `PlaceOrder`).
// Registrations, subscriptions, middlewares, memberships and grants use the qualified name
// `domain.Type` (`orders.PlaceOrder`), where `orders.*` stands for a whole domain and `*` for
// everything.
//
// Times are milliseconds since the Unix epoch. A request with `issued_at` is valid 60 s around
// the kernel's clock; outside that window it fails with UNAUTHENTICATED.
//
// Authorization: every call presents the caller's Grant in the gRPC metadata entry
// `kernable-grant` (see Grant). Rejections by a worker, a middleware or a read model are normal
// outcomes (`Rejected`, with a code); everything else (a bad signature, a missing permission, a
// timeout) is a gRPC status.
syntax = "proto3";

package kernable.v1;

// ---- shared ----

// An Ed25519 signature and the key that made it.
message Signature {
  string key_id = 1; // lowercase hex of the 32-byte public key
  bytes sig = 2;     // 64 bytes: Ed25519 over the message layout in SIGNING.md
}

// A request to change one aggregate. Signed by the client over kernable.v1.command; the kernel
// queues it and hands it to a worker that registered its aggregate and command type.
message Command {
  // Chosen by the client (the SDKs use a random UUID). The kernel runs a command ID once:
  // submitting it again returns the stored result, or waits for it.
  string command_id = 1;
  string tenant_id = 2;
  string domain = 3;         // of the aggregate and the command type
  string aggregate_type = 4; // unqualified: `Order`
  string aggregate_id = 5;   // chosen by the client
  string command_type = 6;   // unqualified: `PlaceOrder`
  bytes payload = 7;
  // Over kernable.v1.command, by a key granted `submit` for `domain.command_type`.
  Signature client_sig = 8;
  RequestContext context = 9; // signed with the command, stored with its events
  // References to the values the payload keeps in the vault (see VaultValue), in payload order.
  repeated string vault_refs = 10;
  // Signed, and only when set: a scheduled command, delivered at this time (ms since epoch) and
  // not before. Submit answers `accepted` at once; until then the command waits beside its
  // aggregate's queue, so the aggregate's other commands pass. Middlewares check it when it is
  // submitted and again when it is due. At most the kernel's `--schedule-max-days` ahead.
  int64 deliver_at = 11;
  // Signed, and only when set: a scheduled command that cannot run by this time (ms since epoch),
  // after an outage say, is rejected `expired` instead of running late.
  int64 deliver_until = 12;
}

// Who sends a request and in which context. Signed by the client together with the request,
// and stored with every event the request causes, so audit and listeners can see it. The kernel
// only acts on `expected_version` and `bypass_authorization`; the rest is for the domain.
// Options for a single call (how long to wait) are not part of it; see SubmitRequest.
message RequestContext {
  // The sender: the real principal, also when acting on behalf of someone else.
  string sender_tenant = 1;
  string sender_identity = 2;
  string sender_account = 3;
  string sender_session = 4;
  string on_behalf_of = 5; // authorize as this identity of the target tenant instead
  // Commands only: rejected with `version_mismatch` unless the aggregate is at this version
  // when the command runs (0: the aggregate has no events yet). Absent: no check.
  optional uint64 expected_version = 6;
  string correlation_id = 7; // shared by everything one original request causes
  string causation_id = 8;   // the command that caused this one, if any
  string trace_id = 9;
  // Privileged switch that tells the domain to skip its own authorization: only keys granted
  // `privileged` for `bypass_authorization` may set it (otherwise PERMISSION_DENIED).
  bool bypass_authorization = 10;
  // Signed in the given order. Business data only, never security decisions.
  repeated Attribute attributes = 11;
}

message Attribute {
  string key = 1;
  string value = 2;
}

// A stored event: a NewEvent of a worker, completed by the kernel when it committed it.
message Event {
  uint64 global_position = 1; // position in the whole log, from 1
  string tenant_id = 2;
  string domain = 3;          // always the domain of the command that caused it
  string aggregate_type = 4;  // unqualified
  string aggregate_id = 5;
  uint64 version = 6;         // the aggregate's version after this event, from 1
  string event_type = 7;      // unqualified: `OrderPlaced`
  bytes payload = 8;
  string command_id = 9;      // the command that caused it
  int64 created_at = 10;      // ms since epoch, when the kernel committed it
  bytes hash = 11;            // SHA-256 link of the hash chain, see SIGNING.md
  // The worker's signature over its result (kernable.v1.result); the same on every event of
  // a command.
  Signature producer_sig = 12;
  RequestContext context = 13;     // of the command that caused the event
  uint32 schema = 14;              // version of the payload format of `event_type`, from 1
  repeated string vault_refs = 15; // see NewEvent
  string erases = 16;              // see NewEvent
  // An event its tenant brought along when it moved here from another partition: where it was
  // first committed. Listeners do not get these; the original is delivered where it is.
  string origin_partition = 17;
  uint64 origin_position = 18;
  // The code version (deployment) of the worker that produced it, as its Register declared it;
  // empty for a worker that declared none, and for the events the kernel writes itself (process
  // cases). Hashed only when set (SIGNING.md).
  string deployment = 19;
}

// An aggregate's state after `version`, made by a worker: a cache, the events stay the truth.
// The kernel drops it when it cannot be used (see Rejection) and after an erasure.
message Snapshot {
  uint64 version = 1;       // the aggregate version the state is after
  string schema = 2;        // state format of the aggregate definition; workers reject unknown ones
  bytes state = 3;          // opaque to the kernel
  Signature worker_sig = 4; // over kernable.v1.snapshot, see SIGNING.md
}

// An event proposed by a worker; the kernel assigns position, version, time and hash.
message NewEvent {
  // Unqualified, of the command's domain; an empty or qualified type rejects the command
  // (`invalid_event_type`).
  string event_type = 1;
  bytes payload = 2;
  // Version of the payload format, from 1. Must be the one declared in
  // Register.event_schemas (1 if not declared), otherwise `invalid_event_schema`.
  uint32 schema = 3;
  // References to the values the payload keeps in the vault, in payload order.
  repeated string vault_refs = 4;
  // A subject (a person) whose vault values this event erases, everywhere; empty for none.
  // The worker's key needs `vault_erase` for the event type (otherwise `erase_not_allowed`).
  string erases = 5;
  // Set by the kernel only, on events a tenant brought from another partition when it moved
  // there: where the event was first committed. A worker's result with them is refused.
  string origin_partition = 6;
  uint64 origin_position = 7;
  // Set by the kernel only, from the producing worker's Register.deployment; whatever a worker
  // sends here is replaced.
  string deployment = 8;
}

// ---- vault ----

// A personal or secret value that a command or event keeps outside the signed log. The payload
// holds `{"$vault": ref}` instead, and `vault_refs` lists the ref. The ref commits to the value:
//   ref = hex(SHA-256(kernable.v1.vault message)), see SIGNING.md,
// over a random salt, the subject, `secret` and the value, so it reveals nothing once erased.
// The kernel keeps values encrypted and deletable, and only with a vault key (`kernable start
// --vault-key`); without one, a submit with vault values fails with FAILED_PRECONDITION and a
// result with vault values is rejected (`no_vault`).
// Personal values belong to a subject and are erased by an event that `erases` it; secret
// values are deleted when their command completes.
message VaultValue {
  string ref = 1;     // lowercase hex, see above
  string subject = 2; // personal: whose value it is; empty for secrets
  bool secret = 3;
  bytes salt = 4;     // 16 random bytes, only on writes
  bytes value = 5;    // the JSON encoding of the field
}

// ---- trust ----

// What a key may do. The kernel trusts root keys only (`kernable start --root`); a root key
// signs a grant over kernable.v1.grant (`kernable grant`). The grantee's process presents it with
// every call, hex-encoded, in the gRPC metadata entry `kernable-grant`; it must name the key that
// signed the request (otherwise PERMISSION_DENIED). The kernel keeps the newest grant per key
// (by issued_at) and ignores older ones. A grant has no time window; it ends when a newer grant
// replaces it or the key, or the root key that signed it, is revoked. Streams whose key loses a
// permission they use end with PERMISSION_DENIED.
//
// A delegated grant is signed by a key that is not a root key, a delegate, whose own grant
// (signed by a root key) has the action `grant` naming the actions it may grant
// (`grant=replicate,read`). It carries that grant in `issuer`. The kernel takes it only for
// those actions (never `*` or `grant` itself), without `succeeds`, and checks it against the
// newest grant of the delegate it knows, so a newer grant of the delegate that names fewer
// actions takes the rest away. One delegation only: an issuer has no issuer. Revoking the
// delegate, or the root key that signed its grant, ends what it granted.
message Grant {
  string key_id = 1;                   // the grantee
  repeated Permission permissions = 2;
  // An older key this key replaces (empty: none). Listeners and aggregates registered with
  // that key may connect with key_id and keep their registration.
  string succeeds = 3;
  int64 issued_at = 4;                 // ms since epoch
  // The signature over kernable.v1.grant: by a root key, or by the delegate `issuer` names.
  Signature root_sig = 5;
  // A delegated grant: the delegate's own grant, signed by a root key (absent: none).
  Grant issuer = 6;
}

// One action and the types it covers. Types are `*`, `domain.*` or a qualified `domain.Type`,
// except where noted. The action `*` stands for all actions.
// - submit: submit commands of these types (CommandService.Submit).
// - run: run commands of these types as a worker (Register).
// - subscribe: read events of these types with EventService.Subscribe.
// - listen: receive events of these types as a listener (Hello.event_types).
// - query: ask queries of these types (QueryService.Query).
// - answer: answer queries of these types as a read model (Hello.query_types).
// - check: check commands and queries of these types as a middleware (Hello.middlewares).
// - privileged: set a privileged switch; the type is the switch, `bypass_authorization`.
// - vault_read: get the vault values of these event types in listener batches, and of these
//   command types in middleware checks.
// - vault_erase: write events of these types that erase a subject (NewEvent.erases).
// - data_read, data_write: get, or put and delete, the files of a domain (`domain.*` or `*`).
// - cache: use the cache of a domain (`domain.*` or `*`).
// - manage: apply the membership of these services (service names, or `*`).
// - replicate: follow the kernel as its standby (`*`).
// - read: follow the kernel as a reader, a read-only copy (`*`); never as its standby.
// - grant: sign grants for other keys (a delegated grant, see Grant) for these actions only;
//   the types are action names, never `*` or `grant`. Not included in the action `*`.
// - export: export the whole kernel (`*`, ExportService in export.proto).
message Permission {
  string action = 1;
  repeated string types = 2;
}

// Revocation of keys, by root-key tooling (`kernable revoke`).
service TrustService {
  // Revokes `key_id` from `since` on, for good. Signed by a root key over kernable.v1.revoke and
  // valid 60 s around issued_at. The kernel stores it signed with its own key
  // (kernable.v1.revocation), refuses the key from then on and ends its streams; queued commands
  // signed with it and received at or after `since` are rejected with `key_revoked`. A revoked
  // root key takes the grants it signed with it. Revoking a key again does nothing.
  // Errors: PERMISSION_DENIED (not a root key, or a revoked one), UNAUTHENTICATED (invalid
  // signature, outside the time window), INVALID_ARGUMENT (`key_id` is not a key ID).
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  // Takes a grant into effect at once, as presenting it with a request does: checked like any
  // grant (signed by a root key, or delegated within its delegate's newest grant), kept if it
  // is the newest for its key, stored and passed on to the standby and the readers. Sessions
  // are checked again when it replaces a grant. Pushing a delegate's newer grant that names
  // fewer actions narrows what the delegate granted at once: grants it signed for the actions
  // taken away stop counting, and sessions that relied on them end.
  // Errors: UNAUTHENTICATED (unsigned, invalid signature), PERMISSION_DENIED (not signed by a
  // root key or a delegate allowed to grant its actions, a revoked key).
  rpc PushGrant(PushGrantRequest) returns (PushGrantResponse);
}

message RevokeRequest {
  string key_id = 1;   // the key to revoke
  int64 since = 2;     // ms since epoch; may lie in the past, e.g. when the key leaked
  int64 issued_at = 3; // ms since epoch
  Signature root_sig = 4;
  uint32 protocol = 5; // not signed
}

message RevokeResponse {}

message PushGrantRequest {
  Grant grant = 1;
  uint32 protocol = 2; // not signed
}

message PushGrantResponse {}

// ---- memberships ----

// Business processes, run by the kernel (design/processes.md).
service ProcessService {
  // Registers a process model (JSON, see design/processes.md "The model format"). Signed over
  // kernable.v1.process by a key granted `process` for the process's qualified name, and
  // `submit` for each command, `query` for each query and `listen` for each event the model
  // names; valid 60 s around issued_at. A model equal to the newest version registers nothing
  // new; a different one becomes the next version. Running cases stay on their version.
  // Errors: UNAUTHENTICATED, PERMISSION_DENIED, INVALID_ARGUMENT (the model is invalid: the
  // message names the step and why; a command type no worker registered and no membership lists).
  rpc Register(ProcessRegistration) returns (ProcessRegistered);
  // Removes a process: it starts no new cases, its running cases finish (as when a membership
  // no longer lists it). Signed over kernable.v1.process_remove by a key granted `process` for
  // it; valid 60 s around issued_at. A later registration makes it active again. Errors:
  // UNAUTHENTICATED, PERMISSION_DENIED, NOT_FOUND (no such process).
  rpc Remove(ProcessRemoval) returns (ProcessRemoved);
  // Resolves a case's incident (design/processes.md, "Incidents"): `retry` runs its step again
  // (a new attempt), `skip` goes on to the step's `next` (refused for a step without a single
  // next), `cancel` ends the case with the end `cancelled` (also a case without an incident).
  // Signed over kernable.v1.process_resolve by a key granted `process` for the process; valid
  // 60 s around issued_at. Errors: UNAUTHENTICATED, PERMISSION_DENIED, NOT_FOUND (no such
  // running case), FAILED_PRECONDITION (no incident to retry or skip; a step without a single
  // next; the case's ID names cases of several tenants: give the tenant).
  rpc Resolve(ProcessResolution) returns (ProcessResolved);
  // Sets as whom the process acts (design/processes.md, "With the kit"): the sender tenant,
  // identity and session of `context` go with every command and query the engine sends for
  // the process from now on (its correlation and causation stay the engine's). Kept with the
  // process's state, replicated to the standby and to every partition. Without it a process
  // acts as `process:<name>`. Idempotent. Signed over kernable.v1.process_act by a key granted
  // `process` for it; valid 60 s around issued_at. Errors: UNAUTHENTICATED, PERMISSION_DENIED,
  // NOT_FOUND (no such process), FAILED_PRECONDITION (a partition that takes its processes
  // from the control partition).
  rpc Act(ProcessActing) returns (ProcessActed);
}

message ProcessActing {
  string name = 1;          // qualified: `shop.fulfilment`
  RequestContext context = 2;
  int64 issued_at = 3;      // ms since epoch
  Signature sig = 4;        // over kernable.v1.process_act
  uint32 protocol = 5;      // not signed
}

message ProcessActed {
  bool changed = 1;  // false: it acted so already
}

message ProcessResolution {
  string process = 1;    // qualified: `shop.fulfilment`
  string case_id = 2;    // the case's aggregate ID: its key and sequence, `o1#1`
  string tenant_id = 3;  // the case's tenant; empty: the one tenant that has the case
  string action = 4;     // retry | skip | cancel
  int64 issued_at = 5;   // ms since epoch
  Signature sig = 6;     // over kernable.v1.process_resolve
  uint32 protocol = 7;   // not signed
}

message ProcessResolved {
  string tenant_id = 1;  // the case's tenant
}

message ProcessRemoval {
  string name = 1;      // qualified: `shop.fulfilment`
  int64 issued_at = 2;  // ms since epoch
  Signature sig = 3;    // over kernable.v1.process_remove
  uint32 protocol = 4;  // not signed
}

message ProcessRemoved {
  bool removed = 1;  // false: it was removed already
}

message ProcessRegistration {
  bytes model = 1;      // the model as JSON
  int64 issued_at = 2;  // ms since epoch
  Signature sig = 3;    // over kernable.v1.process
  uint32 protocol = 4;  // not signed
}

message ProcessRegistered {
  string name = 1;     // qualified: `shop.fulfilment`
  uint32 version = 2;  // from 1
  bool new = 3;        // false: equal to the newest version, nothing registered
}

// What a service consists of, applied by deploy tooling.
service MembershipService {
  // Replaces the membership of `membership.service`. Signed over kernable.v1.membership by a key
  // granted `manage` for the service, and valid 60 s around issued_at. Apply it once per deploy
  // (`kernable apply`, or a deploy script), not from every process: the newest issued_at wins,
  // and an older membership is refused.
  // Errors: UNAUTHENTICATED (invalid signature, outside the time window), INVALID_ARGUMENT (no
  // valid service name, unqualified worker entries, empty listener names), PERMISSION_DENIED,
  // FAILED_PRECONDITION (a membership issued at the same time or later is applied).
  rpc Apply(ApplyRequest) returns (ApplyResult);
}

// What a service consists of. Once a service has one, the kernel waits (readiness) for what it
// lists, and treats workers and listeners of the service that it does not list as dynamic.
// Workers and listeners name their service in Register.service and Hello.service. A service
// without a membership, and a process without a service, count as listed.
// - workers: the aggregate types the service runs (qualified: `shop.Cart`). Commands of a listed
//   aggregate are accepted, and queued, even before a worker registered it. An aggregate a
//   worker runs but the service does not list is forgotten once its last worker leaves.
// - listeners: listener names. A listed listener counts for readiness, settling and the order of
//   delivery; an unlisted one keeps its position but counts for nobody.
// - middlewares: names of the service's listeners that check requests; they count like
//   listeners. A listener of the service that is not listed here cannot connect as a
//   middleware, and taking one off the list removes its check: a check never appears or
//   disappears without a signed membership.
message Membership {
  string service = 1;               // a name like a domain: letters, digits, `-` and `_`
  repeated string workers = 2;      // qualified aggregate types
  repeated string listeners = 3;
  repeated string middlewares = 4;
  repeated Attribute metadata = 5;  // free, e.g. version and description; signed in order
  int64 issued_at = 6;              // ms since epoch
  // Qualified process names (`shop.fulfilment`); signed only when there are any. A process a
  // membership no longer lists starts no new cases; its running cases finish.
  repeated string processes = 7;
  // The deployment (code version) that serves the service; signed only when set. Its workers
  // run the service's commands, its listeners count, its middlewares check and its read models
  // answer queries first. Workers and listeners of the service that declare another deployment
  // stay connected: workers idle, read models keep catching up, for a rollback. A rollback
  // applies a membership naming the earlier deployment. Empty: every deployment serves.
  string deployment = 8;
}

message ApplyRequest {
  Membership membership = 1;
  Signature sig = 2;   // over kernable.v1.membership
  uint32 protocol = 3; // not signed
  // Not signed. A membership that names another deployment than the one serving its service
  // switches to it only once that deployment has caught up: every listener it lists registered
  // for it within --deployment-switch-lag events of the head (or the deployment wrote events
  // before: a rollback), and a worker of it connected for every aggregate it lists. Before, the
  // apply fails FAILED_PRECONDITION `not_caught_up: ...` naming what it waits for. `force`
  // switches at once anyway.
  bool force = 4;
  // Not signed. Applies the membership only if it names the deployment that serves its service
  // already (or the service has no membership yet); otherwise fails FAILED_PRECONDITION
  // `not_serving: ...`. For a process that starts beside the serving deployment and leaves the
  // switch to an operator (an app with switch `never`).
  bool no_switch = 5;
  // Not signed. Refuses a switch to a deployment that served before (it wrote events) with
  // FAILED_PRECONDITION `served_before: ...`: switching back is a rollback, which only an
  // operator does (`kernable apply --deployment`). For an app with switch `caught-up`, so an
  // older deployment's app that restarts runs beside the serving one instead of taking over.
  bool no_rollback = 6;
}

message ApplyResult {}

// ---- partitions ----

// Where each tenant's data lives when several kernels (partitions) share the tenants.
// Every kernel started with `--partition` serves the tenants the map assigns to it and refuses
// the others with FAILED_PRECONDITION `wrong_partition: …`; the SDKs read the map and send each
// request to its tenant's partition.
service PartitionService {
  // The newest map this kernel holds. NOT_FOUND without one (a kernel without --partition
  // serves every tenant); with one, the call needs a grant of any key (kernable-grant): the
  // map names tenants and addresses.
  rpc Map(MapRequest) returns (PartitionMap);
  // Applies a new map on the control partition (the kernel started with --partition but
  // without --control); the other partitions take it from there within seconds. Signed over
  // kernable.v1.partitions by a key granted `manage` for `*`, valid 60 s around issued_at.
  // Errors: UNAUTHENTICATED, PERMISSION_DENIED, INVALID_ARGUMENT (unknown partitions, a tenant
  // twice), FAILED_PRECONDITION (not the control partition; an epoch not above the one held).
  rpc Apply(PartitionMap) returns (MapResult);
  // Asked of the target of a move (needs a grant of any key): whether it copied the tenant.
  rpc Moving(MoveStatusRequest) returns (MoveStatus);
}

message MapRequest {
  uint32 protocol = 1;
}

message MapResult {}

// A partition: its name and the addresses of its kernels (two for a pair with a standby).
message Partition {
  string name = 1;
  repeated string addresses = 2;
}

message TenantPartition {
  string tenant = 1;
  string partition = 2;
}

// A tenant moving between partitions, or moved. While it moves, both partitions answer its
// requests with UNAVAILABLE. Once moved, `source_head` is the source's head when it was copied
// (every original event of the tenant is at or before it) and `target_after` the target's head
// after the copies: an SDK delivers the target's events after it only once the source's stream
// has passed `source_head`, so a tenant's events keep their order across the move.
message TenantMove {
  string tenant = 1;
  string from = 2;
  string to = 3;
  uint64 source_head = 4;
  uint64 target_after = 5;
  uint64 epoch = 6;      // of the map that started the move: tells this move from earlier ones
}

// Tenants listed in `tenants` live on their partition; every other tenant on `default`.
message PartitionMap {
  uint64 epoch = 1;                  // the newest epoch wins; each new map has a higher one
  repeated Partition partitions = 2;
  repeated TenantPartition tenants = 3;
  string default = 4;                // a partition's name
  string control = 5;                // the partition that holds the map and the trust records
  int64 issued_at = 6;               // ms since epoch
  Signature sig = 7;                 // over kernable.v1.partitions
  uint32 protocol = 8;               // not signed
  repeated TenantMove moving = 9;    // being copied to `to`; the tenant waits meanwhile
  repeated TenantMove moved = 10;    // done, with their heads
  // Copied to `to` while the tenant runs on `from` (its finished commands, up to the source's
  // head as of then), so that the move after it stops the tenant only for the rest.
  repeated TenantMove copying = 11;
}

// What a target partition knows of a tenant moving to it.
message MoveStatus {
  bool done = 1;
  uint64 source_head = 2;
  uint64 target_after = 3;
  uint64 epoch = 4; // of the move it copied (TenantMove.epoch)
  bool precopy = 5; // copied while the tenant ran (`copying`): the move's first part only
}

message MoveStatusRequest {
  string tenant = 1;
  uint32 protocol = 2;
}

// ---- clients ----

// Commands, sent by clients and by handlers of listeners.
service CommandService {
  // Submits a command and waits as `wait` says. Needs `submit` for the qualified command type,
  // and a worker that registered it (or a membership that lists its aggregate), otherwise
  // NOT_FOUND. Middlewares before the command may reject it; the outcome is then `rejected`.
  // A command ID that was submitted before is not run again: Submit returns its stored result,
  // or waits for it. If the command does not complete within the kernel's submit timeout,
  // Submit fails with DEADLINE_EXCEEDED, but the command stays queued: resubmit it to get the
  // result. Other errors: UNAUTHENTICATED (missing or invalid signature), PERMISSION_DENIED,
  // INVALID_ARGUMENT, FAILED_PRECONDITION (see `listener`; vault values without a vault),
  // UNAVAILABLE (a middleware is not connected, or the kernel shuts down), DEADLINE_EXCEEDED
  // (a middleware did not answer in time).
  rpc Submit(SubmitRequest) returns (CommandResult);
  // Cancels a scheduled command (`Command.deliver_at`) before it is due: the command completes
  // as rejected `cancelled`, so its ID answers that from then on. Needs `submit` for the
  // command's type; middlewares check it as a cancel of that type (MiddlewareCall.cancel), and
  // may reject it. A command that is due already, running or completed answers `too_late`; an
  // unknown ID `not_found`.
  rpc Cancel(CancelRequest) returns (CancelResult);
}

message CancelRequest {
  string command_id = 1;
  string tenant_id = 2;
  RequestContext context = 3;
  int64 issued_at = 4; // ms since epoch; must be within 60 s of the kernel's clock
  Signature client_sig = 5; // over kernable.v1.cancel
  uint32 protocol = 6; // not signed
}

message CancelResult {
  string command_id = 1;
  oneof outcome {
    Cancelled cancelled = 2;
    Rejected rejected = 3; // too_late, not_found, or by a middleware
  }
}

message Cancelled {}

message SubmitRequest {
  Command command = 1;
  Wait wait = 2;
  uint32 protocol = 3;           // not signed
  repeated VaultValue vault = 4; // the values of `command.vault_refs`
  // Set by SDKs when a listener's handler submits (not signed): the listener's name. A listener
  // handles its events one after another, so it cannot wait for itself: a settling submit then
  // waits only for listeners of a lower order, and a command the listener itself checks as a
  // middleware before is refused (FAILED_PRECONDITION).
  string listener = 5;
}

// How long Submit waits before it responds.
enum Wait {
  // Until every listener that counts has acknowledged the command's last event (default). If
  // that takes longer than the kernel's settle timeout, Submit returns the committed events
  // with `settled` false.
  WAIT_SETTLED = 0;
  // Until the command's events are stored, or it is rejected.
  WAIT_COMMITTED = 1;
  // Until the command is stored in the queue; resubmit it later to get the result.
  WAIT_ACCEPTED = 2;
}

// The outcome of a command; exactly one of `committed`, `rejected` or `accepted` is set.
message CommandResult {
  string command_id = 1;
  oneof outcome {
    Committed committed = 2; // the worker's events, stored
    Rejected rejected = 3;   // by the worker, a middleware or the kernel; nothing was stored
    Accepted accepted = 4;   // queued, not run yet (WAIT_ACCEPTED only)
  }
}

message Committed {
  repeated Event events = 1; // may be empty: a command can produce no events
  // True once every listener that counts has acknowledged the events (WAIT_SETTLED only).
  bool settled = 2;
  // The global position of the last event, 0 without events: a query with it as
  // `min_position` sees the command's events on any copy (the writer or a reader). A reader
  // answers a submit only once its own copy holds it.
  uint64 position = 3;
}

message Accepted {}

// Why a command or query was refused. Codes set by the kernel are listed in the errors
// reference; workers, middlewares and read models choose their own.
message Rejected {
  string code = 1;    // machine-readable, e.g. `version_mismatch`
  string message = 2; // for people
  // Set by the kernel only, never by a worker: for `unique_taken`, the name of the key another
  // aggregate holds (never its value); for `requirement_missing`, the first requirement of the
  // result that does not hold. Stored with the rejection.
  string key = 3;
  Requirement requirement = 4;
}

// Plain event streams, for clients that read the log without registering as a listener.
service EventService {
  // Streams stored events with a global position after `after_position`: first the backlog,
  // then live, until the client cancels. Not registered, so it counts for nobody and keeps no
  // position. Needs `subscribe` for the requested types (PERMISSION_DENIED otherwise, also
  // later, when the key loses it). Errors: UNAUTHENTICATED (invalid signature, outside the time
  // window), UNAVAILABLE (the kernel shuts down).
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

// Signed by a key granted `subscribe` for the requested types, over kernable.v1.subscribe.
message SubscribeRequest {
  uint64 after_position = 1;       // 0: from the first event
  repeated string event_types = 2; // qualified (`orders.OrderPlaced`, `orders.*`); empty = all the key may read
  int64 issued_at = 3;             // ms since epoch; must be within 60 s of the kernel's clock
  Signature client_sig = 4;
  uint32 protocol = 5;             // not signed
}

// ---- queries ----

// Every query goes through the kernel, also between parts of one process, so that signatures,
// grants and the request context always apply. Read models answer them (see Hello).
service QueryService {
  // Asks a query and returns the answer of one read model that answers its type and has
  // processed `min_position` (several are taken in turn). Needs `query` for the qualified query
  // type. Middlewares before the query may reject it, middlewares after it may reject the
  // response; the outcome is then `rejected`. Errors: UNAUTHENTICATED (invalid signature,
  // outside the time window), PERMISSION_DENIED, INVALID_ARGUMENT, UNAVAILABLE (no connected
  // read model answers the type, or a middleware is not connected), DEADLINE_EXCEEDED (no
  // read model answered, or reached `min_position`, within the kernel's query timeout, or a
  // middleware did not answer in time), FAILED_PRECONDITION (see `listener`).
  rpc Query(QueryRequest) returns (QueryResult);
}

// Signed by the client over kernable.v1.query.
message QueryRequest {
  // Chosen by the client (the SDKs use a random UUID); returned in QueryResult. Queries are
  // not stored, so an ID is not checked for reuse.
  string query_id = 1;
  string tenant_id = 2;
  string domain = 3;
  string query_type = 4; // unqualified: `GetOrder`
  bytes payload = 5;
  RequestContext context = 6;
  // Answer only after the read model has processed this global position (0: right away), e.g.
  // the position of the last event of a command the client just submitted.
  uint64 min_position = 7;
  int64 issued_at = 8; // ms since epoch; must be within 60 s of the kernel's clock
  Signature client_sig = 9;
  uint32 protocol = 10; // not signed
  // Set by SDKs when a listener's handler asks (not signed); see SubmitRequest.listener. The
  // query is never routed to that listener, nor to one that could reach `min_position` only
  // after that listener, and refused (FAILED_PRECONDITION) if no other read model answers it
  // or if the listener itself checks the query as a middleware.
  string listener = 11;
  // Signed, and only when set: answer nothing; return an empty response once a read model that
  // answers `query_type` has processed this kernel's head (as of the request) and
  // `min_position`. Not checked by middleware, and any partition takes it, whatever the
  // tenant: the SDKs send it to every partition before a query across tenants
  // (`allPartitions`), so that its answer holds every event committed before it.
  bool wait_only = 12;
  // Signed, and only when set: the aggregate the query is about, as the query type declares it
  // (the SDKs fill it from the query's data). A middleware decides on it as on a command's
  // aggregate, e.g. "only the order's owner may read it"; the read model answers from the data.
  Target target = 13;
  // Not signed: the asker's deployment (code version). The kernel routes the query to a read
  // model of that deployment if one answers it, else to one of the deployment its service's
  // membership names, else to any. Empty: the membership's deployment first.
  string deployment = 14;
}

// The aggregate a query is about; see QueryRequest.target.
message Target {
  string aggregate_type = 1; // qualified: `shop.order`
  string aggregate_id = 2;
}

message QueryResult {
  string query_id = 1;
  oneof outcome {
    bytes response = 2;    // the read model's answer, opaque to the kernel
    Rejected rejected = 3; // by the read model or a middleware
  }
}

// ---- data and cache ----

// Files of a domain, kept by the kernel under (tenant, domain, key), apart from the event log:
// they are neither signed into it nor erased with the vault. Every request is signed by a key
// granted data_read (get) or data_write (put, delete) for the domain, over
// `kernable.v1.data.<op>`, and valid 60 s around issued_at. A put replaces the file under its
// key. A put or delete runs at most once: the same signed request again is a replay, also after
// it failed (it may have taken effect); send it signed anew. Errors:
// UNAUTHENTICATED (invalid signature, outside the time window), PERMISSION_DENIED,
// INVALID_ARGUMENT (domain, key or size), ALREADY_EXISTS (a replay), FAILED_PRECONDITION (a
// put or delete signed before the kernel started: sign it again).
service DataService {
  rpc PutData(DataRequest) returns (DataResult);
  rpc GetData(DataRequest) returns (DataResult);
  rpc DeleteData(DataRequest) returns (DataResult);
  // The files whose keys start with `key` (a prefix, may be empty), up to 1,000 per page, in
  // the order of their keys' bytes, after `after`; granted data_read, checked as
  // `<domain>.ListData`. To find files no event names, or what a tenant stores.
  rpc ListData(DataRequest) returns (DataList);
}

message DataRequest {
  string tenant_id = 1;
  string domain = 2;
  string key = 3;          // any string of 1 to 512 bytes
  bytes data = 4;          // put only; at most --max-data-bytes (16 MiB by default)
  string content_type = 5; // put only, e.g. `application/pdf`
  int64 issued_at = 6;     // ms since epoch
  Signature client_sig = 7;
  uint32 protocol = 8;     // not signed
  // Who asks and in which context, as for a command; signed. Middlewares checking
  // `<domain>.PutData`, `.GetData`, `.DeleteData` or `.ListData` decide on it.
  RequestContext context = 9;
  string after = 10;       // list only: the `next` of the page before; signed
}

message DataResult {
  bool found = 1;          // get and delete: whether the file existed; put: true
  bytes data = 2;          // get only
  string content_type = 3; // get only
  bytes sha256 = 4;        // put and get: the SHA-256 of the file's data, for an event to name
}

message DataList {
  repeated DataEntry files = 1;
  string next = 2; // the last key of this page if there may be more: send it as `after`
}

message DataEntry {
  string key = 1;
  string content_type = 2;
  uint64 size = 3; // bytes
}

// A shared cache of a domain: values under (tenant, domain, key) that may expire. Not durable;
// a kernel restart may empty it. Signed like DataService requests over `kernable.v1.cache.<op>`,
// by a key granted cache for the domain, with the same errors.
service CacheService {
  rpc SetCache(CacheRequest) returns (CacheResult);
  rpc GetCache(CacheRequest) returns (CacheResult);
  rpc DeleteCache(CacheRequest) returns (CacheResult);
}

message CacheRequest {
  string tenant_id = 1;
  string domain = 2;
  string key = 3;        // any string of 1 to 512 bytes
  bytes value = 4;       // set only; at most 1 MiB
  uint64 ttl_ms = 5;     // set only; 0 = until deleted or the kernel restarts
  int64 issued_at = 6;   // ms since epoch
  Signature client_sig = 7;
  uint32 protocol = 8;   // not signed
  // Who asks and in which context, as for a command; signed. Middlewares checking
  // `<domain>.SetCache`, `.GetCache` or `.DeleteCache` decide on it.
  RequestContext context = 9;
}

message CacheResult {
  bool found = 1;  // get and delete: whether the key had a live value; set: true
  bytes value = 2; // get only
}

// ---- listeners ----

// Durable, named, ordered event listeners (read models and reactors).
//
// Event N reaches a listener of order k only after every listener that counts with a lower
// order has acknowledged N; equal orders run in parallel. Delivery is at least once.
//
// A listener can also be a middleware: before the kernel accepts a command or routes a query
// whose type the middleware covers, it asks every such middleware, in chain order, and refuses
// the request at the first rejection. A registered middleware that is not connected refuses
// every request it covers (UNAVAILABLE): the chain fails closed.
service ListenerService {
  // A listener's stream. The listener sends Hello, the kernel a Challenge, the listener a
  // ChallengeResponse, the kernel Ready; then the kernel sends batches, queries and checks, and
  // the listener acks, answers and verdicts. Needs `listen` for the event types, `answer` for
  // the query types and `check` for the middleware types. Errors: INVALID_ARGUMENT (malformed
  // Hello, or an ack beyond the delivered events), PERMISSION_DENIED (missing permission, a
  // name registered with another key, a middleware its membership does not list),
  // ALREADY_EXISTS (a listener of that name is connected, or a live one uses a registered
  // name), UNAUTHENTICATED (challenge failed), RESOURCE_EXHAUSTED (an ack would park more than
  // 10,000 events).
  rpc Listen(stream ListenerMessage) returns (stream ListenerDelivery);
  // Delivers parked events of a registered listener again (see Ack.parked), or dismisses them.
  // Signed over kernable.v1.retry by a key granted `manage` for the listener's service (`*` for
  // a listener without one), and valid 60 s around issued_at. Errors: UNAUTHENTICATED (invalid
  // signature, outside the time window), PERMISSION_DENIED, NOT_FOUND (no such listener).
  rpc Retry(RetryRequest) returns (RetryResult);
}

message RetryRequest {
  string listener = 1;
  repeated uint64 positions = 2; // the parked events; empty: all of them
  bool dismiss = 3;              // remove them instead of delivering them again
  int64 issued_at = 4;           // ms since epoch
  Signature sig = 5;             // over kernable.v1.retry
  uint32 protocol = 6;           // not signed
}

message RetryResult {
  repeated uint64 positions = 1; // the parked events it applied to; requested ones not parked are left out
}

// From the listener; exactly one field is set.
message ListenerMessage {
  oneof msg {
    Hello hello = 1;                           // first message
    ChallengeResponse challenge_response = 2;  // second message
    Ack ack = 3;
    QueryAnswer answer = 4;                    // to a QueryCall
    Verdict verdict = 5;                       // to a MiddlewareCall
  }
}

// From the kernel; exactly one field is set.
message ListenerDelivery {
  oneof msg {
    Challenge challenge = 1; // after Hello
    Ready ready = 2;         // after a valid ChallengeResponse
    Batch batch = 3;
    // Delivered in order with the batches: the answer reflects every batch sent before it.
    QueryCall query = 4;
    // Also in order with the batches; sent only once the listener has caught up with the
    // events committed before it connected.
    MiddlewareCall check = 5;
    Waiting waiting = 6; // instead of Ready, while another instance of a single group is active
  }
}

// A query for a read model to answer with a QueryAnswer of the same `call_id`.
message QueryCall {
  string call_id = 1;
  QueryRequest query = 2; // as the client sent it, with its signature
}

message QueryAnswer {
  string call_id = 1;
  oneof outcome {
    bytes response = 2;
    Rejected rejected = 3;
  }
}

// A request for a middleware to check: pass it with an empty verdict or reject it. Answer with
// a Verdict of the same `call_id`, also after (where it may only count for a query's response).
message MiddlewareCall {
  string call_id = 1;
  oneof request {
    Command command = 2;     // as the client sent it, with its signature
    QueryRequest query = 3;  // as the client sent it, with its signature
    // A file or cache request, before it runs; without the file or value itself.
    DataRequest data = 4;
    CacheRequest cache = 5;
    // A cancel of a scheduled command, as the client sent it; `scheduled` is that command.
    CancelRequest cancel = 11;
  }
  // Before a command only: its vault values, if the key may read them (granted vault_read).
  repeated VaultValue vault = 6;
  When when = 7;
  oneof outcome {
    // After only: the command's result. The middleware only observes it; its verdict is ignored.
    CommandResult command_result = 8;
    // After only: the query's result. A verdict that rejects a response replaces it.
    QueryResult query_result = 9;
  }
  // The qualified type being checked: `shop.AddItem`, `shop.GetCart`, or for files and the
  // cache `shop.PutData`, `shop.GetData`, `shop.DeleteData`, `shop.ListData`, `shop.SetCache`, `shop.GetCache`,
  // `shop.DeleteCache`; for a cancel the scheduled command's type.
  string type = 10;
  // A cancel only: the scheduled command it cancels, as stored.
  Command scheduled = 12;
}

message Verdict {
  string call_id = 1;
  Rejected rejected = 2; // absent: the request passes
}

// When a middleware runs.
enum When {
  // Before the kernel accepts a command or routes a query; a rejection refuses it. Fails
  // closed: while the middleware is away, the requests it covers are refused.
  WHEN_BEFORE = 0;
  // Once the outcome is known. A query's response is sent only if the middleware passes it
  // (fails closed, like before). A command's result, and a rejected query, it only observes,
  // best effort: it is told once the command completes, nobody waits for it, and it misses
  // what happens while it is away.
  WHEN_AFTER = 1;
}

// A listener's registration as a middleware, see Hello.middlewares.
message Middleware {
  // Position in the chain: lower runs first, equal orders by listener name. Negative orders
  // are reserved for kernable's kits: they need a grant of `reserved_order`.
  int32 order = 1;
  // Command and query types it checks: `*`, a domain (`orders.*`) or a qualified type. Not
  // empty; needs `check` for each.
  repeated string types = 2;
  When when = 3;
}

// The first message of a listener's stream. A registered listener (not `live`) is stored under
// its name with its key, order, event types and middlewares, and keeps its position across
// connections; it counts (see Membership) also while disconnected.
message Hello {
  string name = 1;   // unique; one connection per name at a time
  string key_id = 2; // the key that answers the challenge; registered with the name
  // Order of delivery, from 0 (negative orders are reserved for kernable's kits and need a grant of `reserved_order`): event N reaches
  // this listener only after every listener that counts with a lower order acknowledged N.
  int32 order = 3;
  repeated string event_types = 4; // qualified (`orders.OrderPlaced`, `orders.*`); empty = all the key may read
  // Start after this position instead of the stored one, e.g. 0 to rebuild an in-memory read
  // model. Absent: after the stored position, or at the newest event on the first connect, so
  // a new listener never reacts to what happened before it existed.
  optional uint64 from_position = 5;
  repeated string query_types = 6; // qualified query types this listener answers
  // At most one per `when`; none: not a middleware. A listener of a service with a
  // membership must be listed in its `middlewares`.
  repeated Middleware middlewares = 7;
  uint32 protocol = 8;
  // The service this listener belongs to; its membership (see `Membership`) decides whether it
  // counts and whether it may be a middleware. Empty: no service, it always counts.
  string service = 9;
  // Not registered: no stored position, starts at the newest event, does not count for
  // readiness, settling or the order of delivery, and is forgotten when it disconnects. For
  // reactions that only matter while the process runs. Cannot be a middleware, nor use the
  // name of a registered listener.
  bool live = 10;
  // One of several processes that run this listener under one name, e.g. a read model on
  // each node of a pair: 1 to 128 letters, digits, `-`, `_` and `.`, unique in the group. Empty:
  // the only one, and a second connection of the name is refused. The group counts for
  // readiness, settling and the order of delivery as one listener: through an event once one
  // instance acknowledged it, ready once one instance has caught up. Every instance of a group
  // must agree on `single`.
  string instance = 11;
  // With `instance`: one instance at a time gets events, so a reactor's side effects happen
  // once; the others get `Waiting`, and the first of them takes over after the group's position
  // when the active one leaves. Without: every instance gets every event, from its own position,
  // and queries and checks go to any instance that has reached what they need; such an instance
  // cannot park events. Not for live listeners.
  bool single = 12;
  // The code version (deployment) of the process: 1 to 128 letters, digits, `-`, `_` and `.`;
  // empty: none. A listener that answers queries or checks requests (a read model or a
  // middleware) is registered per name and deployment (shown as `name@deployment`): a new
  // deployment's read model has its own position, starts from the first event when the name
  // already has a position under another deployment, and runs beside the old one; its service's
  // membership decides which deployment counts. Any other listener (a reactor) keeps one
  // registration and position across deployments, so a new deployment goes on where the old
  // one stopped and nothing is handled twice.
  string deployment = 13;
  // The listener acts outward (a reactor, as the SDKs register one): a reader, a read-only copy
  // of the writer, delivers nothing to it and answers `Waiting` with `reader_of`, so the same
  // code runs beside a reader and only the writer's reactors act.
  bool reactor = 14;
}

// Another instance of the same `single` group is active; this one gets `Ready` and its
// deliveries when it takes over.
message Waiting {
  string active = 1;  // the active instance
  // Set when a reactor waits for its own deployment to serve its service: the deployment that
  // serves it now. A reactor (one registration for all deployments) acts only for the serving
  // deployment, so a deployment warming up beside it sends nothing outward before its switch.
  string serving = 2;
  // Set by a reader (a read-only copy) for a reactor: reactors run on the writer only, at this
  // address. The listener stays connected and gets nothing here.
  string reader_of = 3;
}

// The kernel accepted the listener; deliveries follow.
message Ready {
  uint64 after_position = 1; // the listener receives events after this position
  uint64 head_position = 2;  // newest event when the listener connected: up to it, it replays
}

// Events for the listener, in order of global position.
message Batch {
  repeated Event events = 1; // only the listener's event types; may be empty
  uint64 up_to = 2;          // last position the batch covers; acknowledge it once processed
  // The values the events refer to, if the key may read them (granted vault_read) and they are not
  // erased; a missing value reads as null.
  repeated VaultValue vault = 3;
  // Parked events an operator asked to deliver again (RetryRequest), to handle before `events`
  // and regardless of the listener's position. Sent alone, with `up_to` the last position
  // delivered. Their vault values are in `vault`.
  repeated Event retries = 4;
}

// The listener has processed everything up to `position` (a Batch.up_to). Not signed; affects
// only waiting and ordering. An ack beyond the delivered batches ends the stream.
message Ack {
  uint64 position = 1;
  // Events of the acknowledged batches (or their retries) the listener gave up on: it moves on,
  // and the kernel keeps them, with the reason, until an operator retries or dismisses them
  // (ListenerService.Retry). Each is above the previously acknowledged position or one of the
  // retries, and at most `position`. Not for live listeners.
  repeated Parked parked = 2;
  // Events of the acknowledged batches the listener skipped because it does not know them (a
  // schema newer than it reads): it moved on without them. The kernel counts them per listener
  // and shows them (UI, metrics); unlike parked events they are not kept for a retry. Each at
  // most `position`.
  repeated Skipped skipped = 3;
}

// An event a listener skipped: newer than its code (see Ack.skipped).
message Skipped {
  uint64 position = 1;
  string event_type = 2; // qualified
  uint32 schema = 3;
}

// An event a listener gave up on.
message Parked {
  uint64 position = 1;
  // Why: a Rejected code (`not_found`), or `handler_error` for any other error. At most 128
  // bytes.
  string code = 2;
  // The rejection's message; for another error only its type (it can hold personal data, and
  // the kernel keeps it): the listener logs the whole error. At most 1,024 bytes.
  string message = 3;
  uint32 attempts = 4; // how often it was handled
}

// ---- workers ----

// Workers run the commands of their aggregates.
service WorkerGateway {
  // A worker's stream. The worker sends Register, the kernel a Challenge, the worker a
  // ChallengeResponse, the kernel Registered; then the kernel sends Execute, at most
  // `max_concurrency` at a time, and the worker answers each with a Result or a Rejection.
  // Needs `run` for every registered command type. When the stream ends, the kernel hands its
  // unfinished commands to another worker. Errors: INVALID_ARGUMENT (malformed Register),
  // PERMISSION_DENIED (missing permission, or an aggregate registered with another key),
  // FAILED_PRECONDITION (the store holds a newer event schema than a worker without a
  // deployment writes),
  // UNAUTHENTICATED (challenge failed, or an invalid result, rejection or snapshot signature).
  rpc Session(stream WorkerMessage) returns (stream KernelMessage);
}

// From the worker; exactly one field is set.
message WorkerMessage {
  oneof msg {
    Register register = 1;                    // first message
    ChallengeResponse challenge_response = 2; // second message
    Result result = 3;
    Rejection rejection = 4;
  }
}

// From the kernel; exactly one field is set.
message KernelMessage {
  oneof msg {
    Challenge challenge = 1;   // after Register
    Registered registered = 2; // after a valid ChallengeResponse
    Execute execute = 3;
    ExecuteMore execute_more = 4; // the rest of an Execute's history
  }
}

// The first message of a worker's stream.
message Register {
  string worker_id = 1; // this process, for logs and the UI
  string key_id = 2;    // the key that answers the challenge and signs results
  // The aggregates the worker runs; at least one. The kernel registers each one: it refuses
  // commands for an aggregate type or command type no worker registered, and is not ready
  // while a registered aggregate has no worker connected. Replicas register the same
  // aggregates, with the same key (or its successor, see Grant.succeeds).
  repeated WorkerAggregate aggregates = 3;
  uint32 max_concurrency = 4; // commands in flight at once; 0 counts as 1
  // The payload version the worker writes per event type; types not listed are written at 1.
  // The kernel refuses a worker, or a result, that would write an older version of a type
  // than the store already holds, and a result whose events differ from what was declared.
  repeated EventSchema event_schemas = 5;
  uint32 protocol = 6;
  // The service this worker belongs to; its membership (see `Membership`) decides whether the
  // kernel waits for the worker's aggregates. Empty: no service, they are always waited for.
  string service = 7;
  // The code version (deployment) of the process: 1 to 128 letters, digits, `-`, `_` and `.`;
  // empty: none. Stored with every event it writes and with its snapshots (it gets only
  // snapshots its own deployment made). When the service's membership names another deployment,
  // the worker gets no commands. With a deployment, `event_schemas` lists every event type the
  // worker knows (also those it only reads, at the version it reads), and the kernel refuses a
  // command (`unknown_history`, before the worker sees it) whose aggregate holds an event of a
  // schema above the declared one, or of a type it does not declare that another deployment
  // first wrote after this deployment's first event. Such a worker may also declare an older
  // schema than the store holds (a rollback); the check above keeps it off aggregates it cannot
  // read.
  string deployment = 8;
}

message WorkerAggregate {
  string aggregate_type = 1;         // qualified: `orders.Order`; once per Register
  repeated string command_types = 2; // qualified, of the same domain: `orders.PlaceOrder`; not empty
}

message EventSchema {
  string event_type = 1; // qualified, of a domain of the worker's aggregates: `orders.OrderPlaced`
  uint32 schema = 2;     // from 1
}

// Proof of key possession, for workers and listeners.
message Challenge {
  bytes nonce = 1; // 32 random bytes
}

message ChallengeResponse {
  bytes sig = 1; // Ed25519 over kernable.v1.challenge with the nonce, by Register/Hello.key_id
}

message Registered {
  string session_id = 1; // currently the worker_id of the Register message
  // Set by a reader (a read-only copy): commands run on the writer at this address, so this
  // worker gets none here. The session stays open and idle.
  string reader_of = 2;
}

// A command for the worker to run. Answer with a Result or a Rejection of the same `lease_id`
// before `deadline`; after it, the command goes to another worker and a late answer is ignored.
message Execute {
  string lease_id = 1;
  Command command = 2; // as the client sent it, with its signature
  repeated Event history = 3; // events after `snapshot.version`, or all events without one
  // The aggregate's current version (0: no events yet); the result's events follow it.
  uint64 expected_version = 4;
  Snapshot snapshot = 5;      // the latest snapshot, if any
  int64 received_at = 6;      // ms since epoch when the kernel accepted the command; stable across retries
  int64 deadline = 7;         // ms since epoch when the lease expires and the command goes to another worker
  repeated VaultValue vault = 8; // the values the command and the history refer to, unless erased
  // The history does not fit one message; ExecuteMore messages of the same
  // `lease_id` follow, in order, with the rest of it (other leases' messages may come between).
  // Run the command once the last one (`more` false) has arrived.
  bool more = 9;
}

// The next part of an Execute's history, with the vault values it refers to.
message ExecuteMore {
  string lease_id = 1;
  repeated Event history = 2;
  repeated VaultValue vault = 3;
  bool more = 4; // another ExecuteMore of this lease follows
}

// The events a command produced (possibly none). Signed by the worker over kernable.v1.result,
// which covers the command and expected_version but not the lease. If another command changed
// the aggregate meanwhile, the kernel runs the command again (Execute with the new history), a
// few times before it rejects it with `concurrency_conflict`.
message Result {
  string lease_id = 1;
  repeated NewEvent events = 2;
  Signature worker_sig = 3; // by Register.key_id
  // Optional: the state after these events, at expected_version + len(events), signed over
  // kernable.v1.snapshot by the same key. Only with at least one event; an invalid snapshot
  // ends the stream like an invalid result signature. Not stored after an erasure.
  Snapshot snapshot = 4;
  repeated VaultValue vault = 5; // the values of the events' `vault_refs`
  // The full set of unique keys and facts the aggregate holds after these events
  // (empty: none), and the facts other aggregates must hold for the command to commit. The
  // kernel checks them atomically with the commit: a key another aggregate holds rejects the
  // command with `unique_taken`, a missing fact with `requirement_missing`. At most 64 keys,
  // 64 facts and 64 requirements; key and fact names are valid type names (no dots) of at most
  // 128 bytes; no key twice (name, scope and value hash), no fact twice. Otherwise
  // `invalid_index`. A command that leaves its aggregate without events holds nothing. An
  // aggregate whose key another one holds (a duplicate from before the key was declared) is
  // rejected with `unique_taken` until its key changes or becomes null.
  repeated UniqueKey keys = 6;
  repeated string facts = 7;
  repeated Requirement requires = 8;
  // Over kernable.v1.index by Register.key_id; required when keys, facts or requires are set.
  // Apart from worker_sig, which every event stores and `kernable verify` checks against the
  // events alone.
  Signature index_sig = 9;
}

// A unique key of an aggregate: no other aggregate holds the same key at the same time.
message UniqueKey {
  string name = 1;      // declared by the aggregate; a valid type name (no dots), at most 128 bytes
  bool global = 2;      // unique across tenants; otherwise within the command's tenant
  bytes value_hash = 3; // SHA-256 of the value's UTF-8 bytes (the domain normalises the value)
  // Personal: the person the value belongs to. The kernel keeps the key in the vault, and
  // erasing the subject frees it. Empty: not personal.
  string subject = 4;
}

// A fact another aggregate of the command's tenant must hold (or, `absent`, must not hold) when
// the command commits. The aggregate is named by its ID, or by a unique key of its
// type that it holds: the key's name and the SHA-256 of its value, as in UniqueKey, in the
// command's tenant (a global key held in another tenant names none). No aggregate holding the
// key, like an aggregate without events, holds no fact. Personal keys cannot name an aggregate.
message Requirement {
  string domain = 1;
  string aggregate_type = 2; // unqualified
  string aggregate_id = 3;   // empty when named by a key
  string fact = 4;
  string key = 5;            // the key's name, instead of aggregate_id
  bytes value_hash = 6;      // with `key`; never returned in a rejection
  bool absent = 7;           // the aggregate must not hold the fact
}

// The worker refuses the command: it is stored as rejected and nothing is written. Signed by
// the worker over kernable.v1.rejection.
// A rejection with code `snapshot_stale` means the worker cannot read the snapshot it got
// (unknown schema): the kernel drops the snapshot and executes the command again with all events.
message Rejection {
  string lease_id = 1;
  Rejected reason = 2;
  Signature worker_sig = 3; // by Register.key_id
}
