// kernable protocol v1 (PoC draft).
// Payloads are opaque bytes; signatures cover the layout defined in SIGNING.md.
syntax = "proto3";

package kernable.v1;

// ---- shared ----

message Signature {
  string key_id = 1;
  bytes sig = 2; // Ed25519
}

message Command {
  string command_id = 1;
  string tenant_id = 2;
  string aggregate_type = 3;
  string aggregate_id = 4;
  string command_type = 5;
  bytes payload = 6;
  Signature client_sig = 7;
}

message Event {
  uint64 global_position = 1;
  string tenant_id = 2;
  string aggregate_type = 3;
  string aggregate_id = 4;
  uint64 version = 5;
  string event_type = 6;
  bytes payload = 7;
  string command_id = 8;
  int64 created_at = 9;
  bytes hash = 10;
  Signature producer_sig = 11;
}

// Event proposed by a worker; the kernel assigns position, version and hash.
message NewEvent {
  string event_type = 1;
  bytes payload = 2;
}

// ---- clients ----

service CommandService {
  rpc Submit(SubmitRequest) returns (CommandResult);
}

message SubmitRequest {
  Command command = 1;
  Wait wait = 2;
}

// How long Submit waits before it responds.
enum Wait {
  // Until every registered listener has acknowledged the command's last event (default).
  WAIT_SETTLED = 0;
  // Until the command's events are stored.
  WAIT_COMMITTED = 1;
  // Until the command is stored in the queue; resubmit it later to get the result.
  WAIT_ACCEPTED = 2;
}

message CommandResult {
  string command_id = 1;
  oneof outcome {
    Committed committed = 2;
    Rejected rejected = 3;
    Accepted accepted = 4;
  }
}

message Committed {
  repeated Event events = 1;
  // True once every registered listener has acknowledged the events.
  bool settled = 2;
}

message Accepted {}

message Rejected {
  string code = 1;
  string message = 2;
}

service EventService {
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

// Streams stored events with a global position after `after_position`: first the backlog,
// then live. Signed by a key in the kernel's `subscribers` allowlist.
message SubscribeRequest {
  uint64 after_position = 1;
  repeated string event_types = 2; // empty = all types the key may read
  int64 issued_at = 3;             // ms since epoch; must be within 60 s of the kernel's clock
  Signature client_sig = 4;
}

// ---- listeners ----

// Durable, named, ordered event listeners (read models and reactors).
//
// Event N reaches a listener of order k only after every registered listener with a lower
// order has acknowledged N. Delivery is at least once.
service ListenerService {
  rpc Listen(stream ListenerMessage) returns (stream ListenerDelivery);
}

message ListenerMessage {
  oneof msg {
    Hello hello = 1;
    ChallengeResponse challenge_response = 2;
    Ack ack = 3;
  }
}

message ListenerDelivery {
  oneof msg {
    Challenge challenge = 1;
    Ready ready = 2;
    Batch batch = 3;
  }
}

message Hello {
  string name = 1;
  string key_id = 2;
  int32 order = 3;
  repeated string event_types = 4; // empty = all types the key may read
  // Start after this position instead of the stored one, e.g. 0 to rebuild an in-memory read model.
  optional uint64 from_position = 5;
}

message Ready {
  uint64 after_position = 1; // the listener receives events after this position
}

message Batch {
  repeated Event events = 1; // only the listener's event types
  uint64 up_to = 2;          // last position the batch covers; acknowledge it once processed
}

message Ack {
  uint64 position = 1;
}

// ---- workers ----

service WorkerGateway {
  rpc Session(stream WorkerMessage) returns (stream KernelMessage);
}

message WorkerMessage {
  oneof msg {
    Register register = 1;
    ChallengeResponse challenge_response = 2;
    Result result = 3;
    Rejection rejection = 4;
  }
}

message KernelMessage {
  oneof msg {
    Challenge challenge = 1;
    Registered registered = 2;
    Execute execute = 3;
  }
}

message Register {
  string worker_id = 1;
  string key_id = 2;
  repeated string command_types = 3;
  uint32 max_concurrency = 4;
}

message Challenge {
  bytes nonce = 1;
}

message ChallengeResponse {
  bytes sig = 1; // Ed25519 over nonce
}

message Registered {
  string session_id = 1;
}

message Execute {
  string lease_id = 1;
  Command command = 2;
  repeated Event history = 3;
  uint64 expected_version = 4;
}

message Result {
  string lease_id = 1;
  repeated NewEvent events = 2;
  Signature worker_sig = 3;
}

message Rejection {
  string lease_id = 1;
  Rejected reason = 2;
  Signature worker_sig = 3;
}
