// Records of the append-only file store (`file:` backend); one record per state change.
// Not part of the wire protocol.
syntax = "proto3";

package kernable.v1;

import "kernable/v1/kernable.proto";

message LogRecord {
  oneof record {
    EnqueuedRecord enqueued = 1;
    CommittedRecord committed = 2;
    RejectedRecord rejected = 3;
    CheckpointRecord checkpoint = 4;
    ListenerRecord listener = 5;
    SnapshotRecord snapshot = 6;
  }
}

message EnqueuedRecord {
  Command command = 1;
  int64 created_at = 2;
}

// All events of one command, so a commit is a single record and therefore atomic.
message CommittedRecord {
  string command_id = 1;
  repeated LoggedEvent events = 2;
}

message LoggedEvent {
  Event event = 1;
  bytes prev_hash = 2;
}

message RejectedRecord {
  string command_id = 1;
  Rejected reason = 2;
}

message CheckpointRecord {
  uint64 global_position = 1;
  bytes chain_hash = 2;
  Signature kernel_sig = 3;
  int64 created_at = 4;
}

// A registered listener and its acknowledged position; the latest record per name wins.
message ListenerRecord {
  string name = 1;
  string key_id = 2;
  int32 order = 3;
  repeated string event_types = 4;
  uint64 position = 5;
  bool removed = 6;
}

// The latest snapshot of a stream; the latest record per stream wins.
message SnapshotRecord {
  string tenant_id = 1;
  string domain = 7;
  string aggregate_type = 2;
  string aggregate_id = 3;
  Snapshot snapshot = 4;
  bytes event_hash = 5; // hash of the stream's event at snapshot.version
  bool removed = 6;
}
