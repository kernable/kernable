// Records of the append-only file store (`file:` backend); one record per state change. They
// are also the record log a primary sends its standby (SQLite keeps them in a table while
// replication is on; design/replication.md). Not part of the client protocol.
syntax = "proto3";

package kernable.v1;

import "kernable/v1/kernable.proto";

message LogRecord {
  oneof record {
    EnqueuedRecord enqueued = 1;
    CommittedRecord committed = 2;
    RejectedRecord rejected = 3;
    CheckpointRecord checkpoint = 4;
    ListenerRecord listener = 5;
    FormatRecord format = 6;
    RevocationRecord revocation = 7;
    WorkerRecord worker = 8;
    MembershipRecord membership = 9;
    Grant grant = 10;
    DataChangedRecord data_changed = 11;
    ReplicationHeadRecord replication_head = 12;
    PartitionMap partition_map = 13;
    GlobalKeyRecord global_key = 14;
    TenantImportedRecord tenant_imported = 15;
    TenantIndexRecord tenant_index = 16;
    ProcessRecord process = 17;
    ProcessPositionRecord process_position = 18;
  }
}

// How far the process engine has handled the log (design/processes.md, "The engine"): after a
// restart or a failover it goes on after this position. The newest record wins.
message ProcessPositionRecord {
  uint64 position = 1;
}

// A business process (design/processes.md). With a `version`: that version of its model, as
// registered (ProcessService.Register); versions are kept forever. Without (0): the process's
// state from then on, removed or active again; the newest such record per process wins, and a
// process without one is active.
message ProcessRecord {
  string name = 1;        // qualified: `shop.fulfilment`
  uint32 version = 2;     // from 1; 0: a change of state
  bytes model = 3;        // the model as signed
  bytes canonical = 4;    // its canonical JSON (keys sorted, no whitespace): what versions compare
  int64 issued_at = 5;    // ms since epoch, signed: with the model, or with the removal
  Signature sig = 6;      // over kernable.v1.process, .process_remove, .process_act or the membership
  int64 recorded_at = 7;  // ms since epoch: when the kernel registered or changed it
  bool removed = 8;       // a change of state: removed (no new cases) or active again
  // A change of state: as whom the process acts (ProcessService.Act), kept with each change;
  // none: as `process:<name>`.
  RequestContext acting = 9;
}

// What a tenant's streams hold here from now on, replacing what they held: on the source
// of a move, nothing once the tenant lives on another partition (its events stay, history like
// any other); on the target, the source's index once the tenant is copied.
message TenantIndexRecord {
  string tenant = 1;
  repeated StreamIndex streams = 2;
}

// The unique keys and facts one stream of a tenant holds.
message StreamIndex {
  string domain = 1;
  string aggregate_type = 2;
  string aggregate_id = 3;
  AggregateIndex index = 4;
}

// On the target of a move: the tenant was copied, so a restart does not copy it again.
message TenantImportedRecord {
  string tenant = 1;
  string from = 2;
  uint64 source_head = 3;
  uint64 target_after = 4;
  uint64 epoch = 5; // the move's (TenantMove.epoch)
  // Copied while the tenant ran (`copying`): the move that follows asks only for what came
  // after `source_head`.
  bool precopy = 6;
}

// On the control partition, the key owner: the partition that may hold a unique key
// with scope global. Whether it still does, that partition's index says; the owner asks it when
// another partition wants the key.
message GlobalKeyRecord {
  bytes id = 1;
  string partition = 2;
}

// A file of the data store was put or deleted. The file is not in the log: a primary reads it
// when it sends the record to its standby (see design/replication.md).
message DataChangedRecord {
  string tenant_id = 1;
  string domain = 2;
  string key = 3;
}

// Where a record log starts that does not start with the store: after a full image, or where
// a SQLite store turned its record log on while it already held data. The records after it
// are numbered from `seq` + 1, chained from `hash`.
message ReplicationHeadRecord {
  uint64 seq = 1;
  bytes hash = 2;
}

// A record of a store's record log, as a standby receives it: `hash` chains it to the record
// before (design/replication.md).
message ReplicatedRecord {
  uint64 seq = 1;
  bytes hash = 2;
  LogRecord record = 3;
}

// A key that must no longer be trusted: the kernel refuses it from now on, and `kernable
// verify` flags what it signed from `since` on. Signed by the kernel; never undone.
message RevocationRecord {
  string key_id = 1;
  int64 since = 2;      // ms since epoch: from when its signatures are suspect
  int64 created_at = 3; // ms since epoch
  Signature kernel_sig = 4;
}

// The first record of every log: the version of this record format. A kernel opens only logs
// of the format it reads.
message FormatRecord {
  uint32 version = 1;
}

message EnqueuedRecord {
  Command command = 1;
  int64 created_at = 2;
}

// All events of one command, so a commit is a single record and therefore atomic.
message CommittedRecord {
  string command_id = 1;
  repeated LoggedEvent events = 2;
  AggregateIndex index = 3; // set: replaces what the command's stream holds
}

// The unique keys and facts an aggregate holds, stored with the commit that changed them; the
// latest per stream wins, and an empty one means it holds nothing.
message AggregateIndex {
  repeated StoredKey keys = 1;
  repeated string facts = 2;
}

message StoredKey {
  string name = 1;
  bool global = 2;
  bytes id = 3;         // kernable.v1.key; empty for a personal key
  string vault_ref = 4; // personal: the vault value holding the id (hex); erased with its subject
}

message LoggedEvent {
  Event event = 1;
  bytes prev_hash = 2;
}

message RejectedRecord {
  string command_id = 1;
  Rejected reason = 2;
}

message CheckpointRecord {
  uint64 global_position = 1;
  bytes chain_hash = 2;
  Signature kernel_sig = 3;
  int64 created_at = 4;
}

// A registered listener and its acknowledged position; the latest record per name wins.
message ListenerRecord {
  string name = 1;
  string key_id = 2;
  int32 order = 3;
  repeated string event_types = 4;
  uint64 position = 5;
  bool removed = 6;
  repeated Middleware middlewares = 7; // kept while disconnected, so the chain fails closed
  string service = 8; // see Hello.service
  int64 last_seen = 9; // ms since epoch when it last connected, disconnected or was running at a flush
  repeated ParkedEvent parked = 10; // by position; stored only with `parked_changed`
  // `parked` is the whole new set of parked events. Otherwise saving the record keeps the stored
  // ones, so a position flush does not write them again.
  bool parked_changed = 11;
}

// An event a listener parked (Ack.parked).
message ParkedEvent {
  uint64 position = 1;
  string event_type = 2; // qualified
  string code = 3;
  string message = 4;
  uint32 attempts = 5;
  int64 parked_at = 6;   // ms since epoch
  bool retry = 7;        // an operator asked to deliver it again; it stays parked until handled
}

// The membership of a service as applied (see `Membership`); the latest record per service wins.
message MembershipRecord {
  Membership membership = 1;
  Signature sig = 2;     // of the key that applied it
  int64 applied_at = 3;  // ms since epoch
}

// A registered aggregate (see Register.aggregates); the latest record per aggregate type wins.
message WorkerRecord {
  string aggregate_type = 1; // qualified
  string key_id = 2;
  repeated string command_types = 3;
  string service = 4;
  int64 last_seen = 5; // ms since epoch when a worker for it last connected or disconnected
  bool removed = 6;
}

// The latest snapshot of a stream, in the snapshot store; the latest record per stream wins.
message SnapshotRecord {
  string tenant_id = 1;
  string domain = 2;
  string aggregate_type = 3;
  string aggregate_id = 4;
  Snapshot snapshot = 5;
  bytes event_hash = 6; // hash of the stream's event at snapshot.version
}
