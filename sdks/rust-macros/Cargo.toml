[package]
name = "kernable-sdk-macros"
description = "The #[event], #[command] and #[query] attributes of kernable-sdk; use them through kernable-sdk."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true

repository.workspace = true
homepage.workspace = true
rust-version = "1.93"
documentation = "https://kernable.com/docs/"
readme = "README.md"
keywords = ["event-sourcing", "cqrs", "kernable"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
