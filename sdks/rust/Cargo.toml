[package]
name = "kernable-sdk"
description = "Write event-sourced business logic in Rust; the kernable kernel does the rest."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The crate is kernable-sdk (kernable is the kernel); code imports it as `kernable`.
[lib]
name = "kernable"

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
kernable-core = { path = "../../crates/kernable-core" }
prost.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true

[dev-dependencies]
sha2.workspace = true
kernable-core = { path = "../../crates/kernable-core" }
