# The Rust code on the concept pages, compiled with the workspace so it cannot drift from the SDK.
[package]
name = "concepts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"
test = false

[dependencies]
kernable = { package = "kernable-sdk", path = "../../../sdks/rust" }
serde.workspace = true
serde_json.workspace = true
