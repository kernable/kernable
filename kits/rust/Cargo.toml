# The kernable kit: tenancy, accounts, identities, groups, invitations and
# authorization as source that is yours to change. `kernable-sdk add kit [dir]` copies it as a
# crate named after `dir`.
[package]
name = "kernable-kit"
version = "0.2.0"
edition = "2024"
license.workspace = true
publish = false

[lib]
name = "kit"

[dependencies]
kernable-sdk = { path = "../../sdks/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
data-encoding = "2"
getrandom = "0.3"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.11"
ciborium = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
hickory-resolver = "0.26"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
rusqlite = { version = "0.41", features = ["bundled"] }
