# Coverage-guided fuzzing with cargo-fuzz (needs nightly): `make fuzz` or
# `cargo +nightly fuzz run <target>` in this directory. Not part of the main workspace.
[package]
name = "kernable-fuzz"
version = "0.1.0"
publish = false
license = "MIT"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kernable-core = { path = "../crates/kernable-core" }
kernable-store = { path = "../crates/kernable-store" }
kernable-kernel = { path = "../crates/kernable-kernel", features = ["fuzzing"] }
prost = "0.14"
sha2 = "0.10"

[workspace]
members = ["."]

[[bin]]
name = "file_log"
path = "fuzz_targets/file_log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "messages"
path = "fuzz_targets/messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_records"
path = "fuzz_targets/log_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grants"
path = "fuzz_targets/grants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http"
path = "fuzz_targets/http.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registrations"
path = "fuzz_targets/registrations.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_files"
path = "fuzz_targets/store_files.rs"
test = false
doc = false
bench = false
